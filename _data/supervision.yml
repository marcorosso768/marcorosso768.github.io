# Pagina supervision: struttura comune (sezioni, ordine) e dati che non si traducono.
# I testi tradotti (titoli delle tesi, progetti, corsi di laurea, etichette) sono in _data/<lingua>/supervision_text.yml.
# Per aggiungere una persona: una voce in "people", la sua chiave nella sezione giusta, e i testi nelle tre lingue
# (titolo della tesi sotto theses, con la stessa chiave; per gli assistenti il progetto sotto projects).
#
# Campi di una persona:
#   name, year: nome e anno
#   program, university: chiavi di programs e universities nei testi
#   ongoing: true se la tesi è in corso (mostra "(ongoing)" / "(in corso)" / "(en curso)")
#   language: it se la tesi è scritta in italiano (mostra "(in Italian)" / "(en italiano)"; niente sulla pagina italiana)
#   project: chiave del progetto (solo assistenti di ricerca)

