entries:
  ai-labor-demand:
    abstract: >-
      We study how the release of ChatGPT affected posted labor demand in the United States, separating the number
      of openings firms advertise from their seniority composition. Using 314 million job postings over 2016–2025
      and a usage-anchored measure of LLM exposure, we compare occupations within the same sector, metropolitan
      market and month across four regimes: pre-pandemic, pandemic shock, pandemic recovery and post-release. From
      the recovery of March 2021–October 2022 to the post-release period, the gap in postings between
      top-quartile-exposed occupations and the rest widens by 6.8 log points. The contraction grows through 2025,
      survives remote-work controls, and is predicted by observed LLM usage over and above ex ante measures of what
      LLMs can do. The seniority composition had moved before the release: among postings our classifier assigns to
      a seniority tier, the junior share in exposed occupations fell by about 3.5 percentage points relative to the
      rest between early 2021 and the quarter before ChatGPT, with remote-work exposure accounting for about 1.5 of
      these points. After the release the share is 0.4 points below the last pre-release quarter, a difference that
      cannot be distinguished from zero. The junior share did decline in exposed occupations relative to the rest,
      but in the two years before the release; the measurable effect of generative AI to date is on the number of
      openings.
    keywords: "generative AI; ChatGPT; labor demand; seniority; job postings; difference-in-differences."
  labels-outcomes:
    abstract: >-
      A label read from the text of a job posting is an outcome: firms can change the wording without changing the
      position. Seniority is such a label, so a difference-in-differences estimate on a labeled junior count mixes a
      posted-demand component with a labeling component, from wording and classifier errors. The labeling rate, the
      share of postings a classifier labels, identifies at most the part common to all tiers; the rest requires
      reference labels on a sample stratified by treatment group, period and assigned tier, unlabeled postings
      included. We give an estimator and an allocation rule; most reference labels go to the unlabeled strata. On
      314 million U.S. postings, after ChatGPT’s release a rule-based classifier’s labeling rate moves by under one
      log point on the application panel, not distinguishably from zero; a stated-years rate reproduced from the
      text rises by about 5 log points from the pandemic on. With 252 human labels, the corrected junior-share
      change is undetermined: its sign depends on the model reading used as input. In simulations, fixed classifier
      errors produce a tier-specific component of about 15 log points at assumed error rates, and usual-size
      validation samples rarely detect a relabeling.
    keywords: "job postings; text-derived measurement; seniority; entry-level work; generative AI; large language models; partial identification."
  tipping-point:
    abstract: >-
      A chance to take a bribe attracts the people who would take it and repels the people who would have to keep
      refusing it. I study both effects in a model of occupational choice in which the cost of resisting responds to
      the bribe, received now, and not to a sanction that comes later. First, consider a bribe without sanctions,
      and suppose some people with almost no integrity are close to indifferent about entering. A small bribe then
      reduces the number of people who want a public job when the share of the value of honesty felt at the moment
      of choice is low enough, and the threshold depends, to leading order, on the two parameters of temptation, not
      on the distribution of types. Second, size does not reveal composition: where a marginal increase in the bribe
      leaves the headcount unchanged, it replaces honest entrants with corrupt ones, and close to that point the
      sector can shrink and worsen together. Third, for reforms that lower the net gain from corruption by the same
      amount, removing the opportunity leaves a corrupt share no higher than a deferred sanction does, at a given
      wage and with a fixed number of posts; with fixed posts, a cost of resisting that is linear or convex, and
      small reforms, letting people choose whether to enter can only shrink the relative advantage of prevention.
      With bribes that rise with the share of corrupt incumbents, the ranking extends to steady states, and
      prevention can remove a high-corruption steady state that an equal sanction preserves.
    keywords: "occupational selection; self-control and temptation; corruption; deterrence; public-sector labor markets; multiple equilibria."
  crime-voting:
    abstract: >-
      This paper studies how exposure to geolocated crime-related news shapes individual voting behavior in
      Italian elections. Using a panel of non-relocating voters observed across multiple election rounds, we
      exploit within-individual variation in exposure to nearby crime news during the pre-election month,
      controlling for individual and district-by-election fixed effects. Aggregate exposure yields weak, unstable
      effects. Disaggregating by offender nationality reveals systematic patterns: immigrant-attributed crime news
      reduces support for parties with ambiguous immigration stances (e.g., Five Star Movement) and increases
      support for clear “law-and-order” parties, while Italian-attributed crime has negligible effects. Effects
      are stronger among high-skilled voters shifting from M5S and low-skilled voters abandoning Lega. In local
      elections, Italian crime punishes incumbents, while immigrant crime increases abstention. These asymmetric
      responses—absent in aggregate measures—indicate that crime salience operates primarily through
      identity-based framing rather than through generalized concerns about crime or security. The findings
      highlight how media attribution shapes electoral accountability.
    keywords: "crime; immigration; elections; news media; individual voting behavior."
  childbirth-turnout:
    abstract: >-
      Childbirth is a temporary shock that hits two voters in one household. I ask how the resulting change in
      turnout is distributed within the couple. I use administrative turnout records for four elections in Bologna
      (2004–2013), linked to population registers that connect both parents to the same birth. Voting is in person
      on fixed days, and the only accommodation around childbirth is a vote in hospital for the admitted patient. I
      compare couples whose child is born just before the polling days with couples whose child is born just after.
      The loss of votes comes mostly from births in the last week before the vote. Relative to couples whose child
      is born in the four weeks after the vote, these couples cast 33.9 fewer votes per 100 couples, and the
      probability that both parents vote is 23.6 points lower; father-only voting and abstention by both parents are
      each about ten points more likely, while mother-only voting differs little; the rise in couples with no voter
      is in line with what the two parents’ losses imply if the link between their decisions is unchanged. For
      births eight to 28 days before the vote, the differences are much smaller. A second, descriptive design
      follows couples around their first birth: in the first month after the birth their turnout is below their own
      pre-birth level, and from three months onward the gap between the mother’s and the father’s turnout is back
      near its pre-birth value, while joint voting stays slightly below it. Accommodations for voters around
      childbirth should therefore be evaluated by their effect on the turnout of both parents.
    keywords: "voter turnout; voting costs; childbirth; couples; household; gender; political participation."
  childcare-turnout:
    abstract: >-
      Does living near a locally provided public good raise the turnout of the households it serves? We study public
      childcare in Bologna, Italy, with administrative turnout records for four elections (2004–2013) linked to
      population registers and to a geocoded census of facilities. We follow parents with a single child from
      nursery to preschool to primary school, so that the facility that matters, and its distance from home, changes
      with the child’s age. If proximity leads parents to hold the municipality accountable, turnout should fall
      with distance to the municipal services (nursery and preschool) in local elections only, and not with distance
      to the state primary school. In the baseline, which follows each parent across elections, turnout does not
      fall with distance. Equivalence tests rule out effects larger than 0.56 percentage points per 100 meters, or
      1.5 points over the interquartile range of distance: over that range, effects as large as the previously
      documented 2.6-point turnout loss of mothers one to two years after a first birth are ruled out. Effects of
      one point are not. Within the precision of the data, proximity also leaves the turnout penalty of parenthood
      unchanged. When parents are also compared within polling precinct and election, turnout in local elections
      falls with distance to the state school and, among parents with an unchanged address, to the municipal
      services. This fall is significant only in 2009, though not distinguishably from 2004. Because the state
      school shows it too and the municipal and state tiers cannot be told apart, the design can neither attribute
      it to accountability nor rule that reading out. The estimates bound the effect of living near a facility, not
      of obtaining a place in it.
    keywords: "voter turnout; public goods; childcare; gender; local elections."
