entries:
  ai-labor-demand:
    abstract: >-
      We study how the release of ChatGPT affected posted labor demand in the United States, separating the number
      of openings firms advertise from their seniority composition. Using 314 million job postings over 2016–2025
      and a usage-anchored measure of LLM exposure, we compare occupations within the same sector, metropolitan
      market and month across four regimes: pre-pandemic, pandemic shock, pandemic recovery and post-release. From
      the recovery of March 2021–October 2022 to the post-release period, the gap in postings between
      top-quartile-exposed occupations and the rest widens by 6.8 log points. The contraction grows through 2025,
      survives remote-work controls, and is predicted by observed LLM usage over and above ex ante measures of what
      LLMs can do. The seniority composition had moved before the release: among postings our classifier assigns to
      a seniority tier, the junior share in exposed occupations fell by about 3.5 percentage points relative to the
      rest between early 2021 and the quarter before ChatGPT, with remote-work exposure accounting for about 1.5 of
      these points. After the release the share is 0.4 points below the last pre-release quarter, a difference that
      cannot be distinguished from zero. The junior share did decline in exposed occupations relative to the rest,
      but in the two years before the release; the measurable effect of generative AI to date is on the number of
      openings.
    keywords: "generative AI; ChatGPT; labor demand; seniority; job postings; difference-in-differences."
  labels-outcomes:
    abstract: >-
      A label read from the text of a job posting is an outcome: the firms under study can change the wording
      without changing the position. Seniority is such a label, so a difference-in-differences estimate on a labeled
      junior count mixes a posted-demand component with a labeling component, from firms’ wording and classifier
      errors. The share of postings a classifier labels, its labeling rate, identifies at most the part of that
      component common to all tiers; the part that moves postings between tiers requires reference labels on a
      sample stratified by treatment group, period and assigned tier, unlabeled postings included. We give an
      estimator and an allocation rule that places most reference labels in the unlabeled strata. On 314 million
      U.S. postings around the release of ChatGPT, the labeling rate of a rule-based classifier moves after the
      release by at most about half a percentage point in any year relative to the recovery, under one log point and
      not distinguishable from zero. For the stated-years reading behind providers’ structured fields it rises by
      about 5 log points, starting with the pandemic. With 252 human labels, the sign of the corrected change in the
      junior share depends on which model reading is corrected. In a semi-synthetic exercise, a classifier with
      fixed errors produces a tier-specific component of about 15 log points from changes in stratum sizes alone,
      and validation samples of the usual size detect an injected relabeling in at most one replication in five.
    keywords: "job postings; text-derived measurement; seniority; entry-level work; generative AI; large language models; partial identification."
  tipping-point:
    abstract: >-
      A chance to take a bribe attracts the people who would take it and repels the people who would have to keep
      refusing it. I study both effects in a model of occupational choice in which the cost of resisting responds to
      the bribe, received now, and not to a sanction that comes later. First, a small bribe reduces the number of
      people who want a public job when the share of the value of honesty felt at the moment of choice is low
      enough; to leading order the threshold depends on the two parameters of temptation, not on the distribution of
      types. Second, size does not reveal composition: at that threshold the headcount stands still while honest
      entrants are replaced by corrupt ones, and just above it the sector shrinks and worsens together. Third, for
      reforms that lower the net gain from corruption by the same amount, removing the opportunity leaves a corrupt
      share no higher than a deferred sanction does, at a given wage and with a fixed number of posts; with fixed
      posts, letting people choose whether to enter dilutes this advantage and never amplifies it. With bribes that
      rise with the share of corrupt incumbents, the ranking extends to steady states, and prevention can remove a
      high-corruption steady state that an equal sanction preserves.
    keywords: "occupational selection; self-control and temptation; corruption; deterrence; public-sector labor markets; multiple equilibria."
  crime-voting:
    abstract: >-
      This paper studies whether exposure to geolocated crime news shifts individual voting behavior in Italian
      elections. Using a panel of non-relocating Bologna voters observed across multiple election rounds, we exploit
      within-individual variation in exposure to nearby crime news during the pre-election month, holding constant
      individual and election fixed effects. Aggregate crime-news exposure yields weak and imprecise associations.
      Disaggregating by the offender’s perceived nationality reveals a sharp asymmetry. At national elections,
      exposure to immigrant-attributed crime news near a voter’s residence is associated with a within-individual
      decline of roughly 2 percentage points in support for the Five Star Movement—the largest party without a clear
      immigration stance during the sample period—and with a comparable rise in abstention; crime news attributed to
      Italian citizens carries no comparable association. The response is specific to crime content: comparable
      local non-crime news produces no analogous shift. These asymmetric responses, absent in aggregate measures,
      are more consistent with a nationality cue in crime reporting that activates an immigration-and-security frame
      than with a uniform reaction to crime salience. The evidence points to the attribution of crime in local news,
      rather than its mere occurrence, as the margin that matters for electoral behavior. A timing falsification
      supports the campaign-window reading but is sensitive to the offender-nationality classifier; we accordingly
      read the estimates as associations, with a cross-source replication under way to settle the causal
      interpretation.
    keywords: "crime; immigration; elections; news media; individual voting behavior."
  childbirth-turnout:
    abstract: >-
      Childbirth is a temporary shock that hits two voters in one household. I ask how the resulting change in
      turnout is distributed within the couple. I use administrative turnout records for four elections in Bologna
      (2004–2013), linked to population registers that connect both parents to the same birth. Voting is in person
      on fixed days, and the only alternative is a vote in hospital for the admitted patient. I compare couples
      whose child is born just before the polling days with couples whose child is born just after. The loss of
      votes comes from births in the last week before the vote. Relative to couples whose child is born in the four
      weeks after the vote, these couples cast 33.9 fewer votes per 100 couples (out of a possible 200), and the
      probability that both parents vote is 23.6 points lower; father-only voting and abstention by both parents are
      each about ten points more likely, while mother-only voting differs little. Most of the fathers’ additional
      abstention occurs in couples in which the mother also abstains, but the data cannot tell whether the birth
      changes the dependence between the partners’ decisions. For births eight to 28 days before the vote, the
      differences are much smaller. A second, descriptive design follows couples around their first birth: in the
      first month after the birth their turnout is below their own pre-birth level, and from three months onward the
      gap between the mother’s and the father’s turnout is back near its pre-birth value. Accommodations for voters
      around childbirth should therefore be evaluated by their effect on the turnout of both parents.
    keywords: "voter turnout; voting costs; childbirth; couples; household; gender; political participation."
  childcare-turnout:
    abstract: >-
      Does living near a locally provided public good raise the turnout of the households it serves? We study public
      childcare in Bologna, Italy, with administrative turnout records for four elections (2004–2013) linked to
      population registers and to a geocoded census of facilities. We follow parents with a single child from
      nursery to preschool to primary school, so that the facility that matters, and its distance from home, changes
      with the child’s age. If proximity leads parents to hold the municipality accountable, turnout should fall
      with distance to the municipal services (nursery and preschool) in local elections only, and not with distance
      to the state primary school. In the baseline, which follows each parent across elections, turnout does not
      fall with distance. Equivalence tests rule out effects larger than 0.56 percentage points per 100 meters, or
      1.5 points over the interquartile range of distance: over that range, effects as large as the previously
      documented 2.6-point turnout loss of mothers one to two years after a first birth are ruled out. Effects of
      one point are not. Within the precision of the data, proximity also leaves the turnout penalty of parenthood
      unchanged. When parents are also compared within polling precinct and election, turnout in local elections
      falls with distance to the state school and, among parents with an unchanged address, to the municipal
      services. This fall is significant only in 2009, though not distinguishably from 2004. Because the state
      school shows it too and the municipal and state tiers cannot be told apart, the design can neither attribute
      it to accountability nor rule that reading out. The estimates bound the effect of living near a facility, not
      of obtaining a place in it.
    keywords: "voter turnout; public goods; childcare; gender; local elections."
