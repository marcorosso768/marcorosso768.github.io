entries:
  ai-labor-demand:
    abstract: >-
      We study how the release of ChatGPT affected posted labor demand in the United States, separating the number
      of openings firms advertise from their seniority composition. Using 314 million job postings over 2016–2025
      and a usage-anchored measure of LLM exposure, we compare occupations within the same sector, metropolitan
      market and month across four regimes: pre-pandemic, pandemic shock, pandemic recovery and post-release. After
      the release, posted demand in the most exposed occupations falls by 6.8 log points relative to the pandemic
      recovery of March 2021–October 2022, a contraction that widens through 2025, survives remote-work controls,
      and loads on measured LLM usage beyond <i>ex ante</i> capability. The seniority composition had moved before
      the release: the junior share of classified postings in exposed occupations fell by 3.5 percentage points
      between early 2021 and the quarter before ChatGPT, in step with remote-work exposure, which accounts for about
      1.5 points of the decline. After the release the share does not move further relative to the last pre-release
      quarter. Our results confirm the decline in junior postings in exposed occupations, but date it to the two
      years before the release; the measurable effect of generative AI to date is on the number of openings.
    keywords: "generative AI; ChatGPT; labor demand; seniority; job postings; difference-in-differences."
  labels-outcomes:
    abstract: >-
      Junior postings appear to decline in AI-exposed occupations, but seniority is read from text firms can reword
      without changing the job. A difference-in-differences estimate on a junior count mixes a change in jobs posted
      with a labeling component, from wording and classifier errors. The share of postings a classifier labels, its
      labeling rate, reveals only the component common to all tiers; the tier-specific part needs human labels on a
      sample stratified by exposure group, period and assigned tier, unlabeled postings included. We give an
      estimator and label allocation. On 314 million U.S. postings, with tier mix unchanged, the largest yearly fall
      in a rule-based classifier’s labeling rate after ChatGPT puts this component at about −0.7 log points on the
      application panel (−1.5 on a coarser panel, where stated years give +5 from the pandemic on). With 252 human
      labels the corrected junior-share change has no stable sign across LLM readings; simulations call for
      thousands of labels.
    keywords: "job postings; text-derived measurement; seniority; entry-level work; generative AI; large language models; partial identification."
  tipping-point:
    abstract: >-
      Corruption opportunities attract people who would exploit them and repel people who anticipate the cost of
      resisting them. I study both margins in a model of occupational choice with self-control costs. Three results
      stand out. First, without sanctions, small corruption rents shrink the pool of entrants when less than half of
      the value of honest service is received at the moment of decision and the self-control conflict is strong
      enough relative to that share. Second, the public sector can lose average integrity while it shrinks, so a
      stable or falling headcount can conceal a deteriorating workforce. Third, at equal net corrupt surplus,
      removing corruption opportunities yields a weakly lower corrupt share than deferred sanctions, both at a given
      wage and with a fixed number of posts, although not necessarily higher average integrity. When rents rise with
      the share of corrupt incumbents, the ranking extends to steady states, and prevention can remove a
      high-corruption steady state that an equivalent sanction preserves.
    keywords: "occupational selection; self-control and temptation; corruption; deterrence; public-sector labor markets; multiple equilibria."
  crime-voting:
    abstract: >-
      This paper studies whether exposure to geolocated crime news shifts individual voting behavior in Italian
      elections. Using a panel of non-relocating Bologna voters observed across multiple election rounds, we exploit
      within-individual variation in exposure to nearby crime news during the pre-election month, holding constant
      individual and election fixed effects. Aggregate crime-news exposure yields weak and imprecise associations.
      Disaggregating by the offender’s perceived nationality reveals a sharp asymmetry. At national elections,
      exposure to immigrant-attributed crime news near a voter’s residence is associated with a within-individual
      decline of roughly 2 percentage points in support for the Five Star Movement—the largest party without a clear
      immigration stance during the sample period—and with a comparable rise in abstention; crime news attributed to
      Italian citizens carries no comparable association. The response is specific to crime content: comparable
      local non-crime news produces no analogous shift. These asymmetric responses, absent in aggregate measures,
      are more consistent with a nationality cue in crime reporting that activates an immigration-and-security frame
      than with a uniform reaction to crime salience. The evidence points to the attribution of crime in local news,
      rather than its mere occurrence, as the margin that matters for electoral behavior. A timing falsification
      supports the campaign-window reading but is sensitive to the offender-nationality classifier; we accordingly
      read the estimates as associations, with a cross-source replication under way to settle the causal
      interpretation.
    keywords: "crime; immigration; elections; news media; individual voting behavior."
  childbirth-turnout:
    abstract: >-
      Childbirth is a temporary shock that hits two voters in one household. I ask how the resulting change in
      turnout is distributed within the couple. I use administrative turnout records for four elections in Bologna
      (2004–2013), where voting is in person on fixed days and the only alternative is a vote in hospital for the
      admitted patient, linked to registers that connect both parents to the same birth. I compare couples whose
      child is born just before the polling days with couples whose child is born just after. The loss of votes is
      concentrated in births in the last week before the vote. Relative to couples whose child is born in the four
      weeks after the vote, these couples cast 33.9 fewer votes per 100 couples (out of a possible 200), and the
      probability that both parents vote is 23.6 points lower; father-only voting and abstention by both parents are
      each about ten points more likely, while mother-only voting differs little. For births one to four weeks
      before the vote, the differences are small. A second, descriptive design follows couples around their first
      birth: in the first month after the birth their turnout is below their own pre-birth level, and from three
      months onward the gap between the mother’s and the father’s turnout is back near its pre-birth value.
      Accommodations for voters around childbirth should therefore be evaluated by their effect on the turnout of
      both parents.
    keywords: "voter turnout; voting costs; childbirth; couples; household; gender; political participation."
  childcare-turnout:
    abstract: >-
      Does proximity to locally provided public goods raise the political participation of the households they are
      meant to serve? We study Bologna, Italy, with administrative turnout records for all registered voters at four
      elections (2004–2013), linked to annual population registers, income, exact dates of birth, and a
      purpose-built geocoded census of childcare facilities. Our baseline follows parents with one co-resident child
      in the annual register as the child ages across service regimes, so that the relevant distance switches within
      person, and estimates separate distance slopes for local and national elections. The municipal-facility
      distance slope in local elections is statistically indistinguishable from zero, with a symmetric equivalence
      bound of 0.47 percentage points per 100 meters, or 1.25 points across the interquartile range of distance. The
      local–national contrast that the accountability hypothesis restricts is estimated less precisely: its bound is
      0.79 points per 100 meters, and moderate effects on it remain compatible with the evidence. Proximity does not
      measurably moderate the parenthood penalty, no gender interaction survives multiplicity adjustment, and a
      switching cohort and six additional local amenities and services yield the same result. An earlier marginal
      contrast among parents with verified address continuity is not robust to specification and is reported as
      exploratory. The estimand is proximity: the estimates bound the mobilizing effect of living near a facility
      and leave the effect of obtaining a place in it unmeasured.
    keywords: "voter turnout; public goods; childcare; gender; local elections."
