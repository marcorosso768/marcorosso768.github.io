empirical_methods_for_law_and_economics:
  lecture: "Lecture"
  sections:
    course-info: "course information"
    lecture-notes: "lecture notes"
    do-files: "do-files"
    dataset: "dataset"
  notes:
    do-files: "Keep the files in one course folder, with the same structure as here: the setup do-file in <code>do/</code>, the worksheets in <code>do/exercises/</code>, the simulation in <code>do/ready_to_run/</code>, and the dataset in <code>data/</code>. Run every do-file with that folder as Stata's working directory."
  details:
    contracts_2019:
      summary: "source and licence"
      body: |
        <p><b>Source.</b> World Bank Group, <i>Doing Business</i>, “Enforcing contracts” indicators. Edition: <i>Doing Business 2020</i> (data as of 1 May 2019); the World Bank’s data files label this year “2019”. <a href="https://datacatalog.worldbank.org/search/dataset/0038564/doing-business">Catalogue</a>; downloaded on 6 October 2026 (DB_CSV.zip).</p>
        <p><b>Licence.</b> <a href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Attribution 4.0 (CC BY 4.0)</a>. Attribution required. No endorsement by the World Bank is implied.</p>
        <p><b>Changes made.</b> Selected 8 enforcing-contracts series and 191 economies (economies with a region in the source metadata; regional aggregates excluded; Liechtenstein included although outside the 190-economy ranking); reshaped to one row per economy; renamed and labelled variables; joined region and income-group metadata. No imputation; values unchanged.</p>
        <p><b>Scope.</b> The indicators describe a standardized hypothetical commercial dispute in the largest business city (two cities averaged for 11 economies), based on expert questionnaires: they are not averages of observed cases. Doing Business was discontinued in September 2021 after data irregularities were found in the 2018 and 2020 editions. Use as historical teaching data. Region and income-group labels are source metadata.</p>
