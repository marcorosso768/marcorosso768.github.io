empirical_methods_for_law_and_economics:
  lecture: "Lecture"
  sections:
    course-info: "course information"
    lecture-notes: "lecture notes"
    do-files: "do-files"
    dataset: "dataset"
  groups: # sottotitoli fissi dentro le settimane dei do-file
    exercises: "exercises"
    ready_to_run: "ready to run"
  notes:
    do-files: "Keep the files in one folder (e.g. <code>stata/do/</code>), with the same structure as here: <code>00_setup.do</code> in the folder itself, the exercises in <code>exercises/</code>, their solutions in <code>solutions/</code>, the simulation in <code>ready_to_run/</code>, and the datasets in <code>data/</code>. Run every do-file with that folder as Stata's working directory."
  details:
    contracts_2019:
      summary: "source and licence"
      body: |
        <p><b>Source.</b> World Bank Group, <i>Doing Business</i>, “Enforcing contracts” indicators. Edition: <i>Doing Business 2020</i> (data as of 1 May 2019); the World Bank’s data files label this year “2019”. <a href="https://datacatalog.worldbank.org/search/dataset/0038564/doing-business">Catalogue</a>; downloaded on 6 October 2026 (DB_CSV.zip).</p>
        <p><b>Licence.</b> <a href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Attribution 4.0 (CC BY 4.0)</a>. Attribution required. No endorsement by the World Bank is implied.</p>
        <p><b>Changes made.</b> Selected 8 enforcing-contracts series and 191 economies (economies with a region in the source metadata; regional aggregates excluded; Liechtenstein included although outside the 190-economy ranking); reshaped to one row per economy; renamed and labelled variables; joined region and income-group metadata. No imputation; values unchanged.</p>
        <p><b>Scope.</b> The indicators describe a standardized hypothetical commercial dispute in the largest business city (two cities averaged for 11 economies), based on expert questionnaires: they are not averages of observed cases. Doing Business was discontinued in September 2021 after data irregularities were found in the 2018 and 2020 editions. Use as historical teaching data. Region and income-group labels are source metadata.</p>
    gdp_2019:
      summary: "source and licence"
      body: |
        <p><b>Source.</b> World Bank, <i>World Development Indicators</i>: GDP (current US$, NY.GDP.MKTP.CD) and total population (SP.POP.TOTL), 2019. Obtained from the normalized CSV mirrors <a href="https://github.com/datasets/gdp">datasets/gdp</a> and <a href="https://github.com/datasets/population">datasets/population</a>; downloaded on 13 October 2026.</p>
        <p><b>Licence.</b> <a href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Attribution 4.0 (CC BY 4.0)</a>. No endorsement by the World Bank is implied.</p>
        <p><b>Changes made.</b> Kept 2019; removed regional and income-group aggregates; computed GDP per capita as GDP divided by population; renamed and labelled variables. 210 economies, one row per economy. WDI values are revised over time: these are from the April 2026 vintage.</p>
    justice_europe_2019:
      summary: "source and licence"
      body: |
        <p><b>Source.</b> Eurostat, “Personnel in the criminal justice system by sex” (crim_just_job) and “Police-recorded offences by offence category” (crim_off_cat): per hundred thousand inhabitants, both sexes, 2019. Both datasets updated on 29 April 2026; downloaded on 13 October 2026 through the Eurostat API.</p>
        <p><b>Licence.</b> Free re-use under the <a href="https://ec.europa.eu/eurostat/web/main/help/copyright-notice">Eurostat copyright notice</a>, provided the source is acknowledged and changes are stated. Data for countries outside the EU, EFTA and candidate countries may be subject to restrictions on commercial reuse; this file is for teaching only. The changes below are the instructor’s; Eurostat is not responsible for them.</p>
        <p><b>Changes made.</b> Selected 2 personnel categories and 6 offence categories; kept 2019; one row per country (37 European countries); merged by ISO3 code with time to enforce contracts and the judicial quality index from Doing Business 2020 (World Bank, CC BY 4.0) and with World Bank GDP per capita for 2019. No imputation; values unchanged.</p>
        <p><b>Scope.</b> Recorded offences count offences reported to and recorded by the police under national legal definitions: they do not measure how widespread crime is. Professional judges are counted under national definitions. The United Kingdom and Bosnia and Herzegovina have no 2019 values. Kosovo: this designation is without prejudice to positions on status, and is in line with UNSCR 1244/1999 and the ICJ Opinion on the Kosovo declaration of independence.</p>
