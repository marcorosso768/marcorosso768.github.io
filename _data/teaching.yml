# Pagina teaching: struttura comune (sezioni, gruppi, atenei, ordine dei corsi) e dati che non si traducono.
# I testi tradotti (titoli, corsi di laurea, nomi degli atenei) sono in _data/<lingua>/teaching_text.yml.
# Per aggiungere un corso: una voce in "courses", la sua chiave sotto l'ateneo giusto, e i testi nelle tre lingue.
#
# Campi di un corso:
#   unibo: anno/codice del catalogo degli insegnamenti di Bologna (il link cambia con la lingua: /en/ o /it/)
#   url: link al corso, se non è nel catalogo di Bologna (uguale in tutte le lingue)
#   with: docenti con cui è tenuto il corso, chiavi di _data/people.yml
#   materials: true se il corso ha una pagina di materiali (l'indirizzo è nei testi di ogni lingua)
#   dates: anni accademici

sections:
  - key: instructor
    expanded: true
    groups:
      - key: current
        id: instructor-current
        expanded: true
        institutions:
          - key: unibo
            courses:
              - empirical-methods-law-economics
              - pre-sessional-econometrics
              - economics-eu
      - key: earlier
        id: instructor-earlier
        expanded: true
        institutions:
          - key: unibo
            courses:
              - python-for-economists
              - microeconomics-business-administration
              - econometrics-business-economics
  - key: teaching-assistant
    expanded: true
    groups:
      - key: current
        id: ta-current
        expanded: true
        institutions:
          - key: unibo
            courses:
              - microeconometrics
              - economic-policy-methods
              - behavioral-economics-2026
              - microeconomics-economics-finance
              - statistics-data-tutoring
              - econometrics-public-policy
              - industrial-economics
              - political-economy
      - key: earlier
        id: ta-earlier
        expanded: false
        institutions:
          - key: unibo
            courses:
              - microeconomics-economics-politics
              - game-theory-economics-econometrics
              - behavioral-economics-2022
              - globalization
          - key: unibo-forli
            courses:
              - competition-economics-policy
              - microeconomics-forli
              - game-theory-forli
          - key: unito-saa
            courses:
              - public-management
              - microeconomics-turin

