# Pagina research: tutto ciò che non si traduce (ordine delle sezioni, titoli, coautori, link, JEL, BibTeX).
# I testi tradotti (titoli delle sezioni, abstract, keywords, etichette) sono in _data/<lingua>/research_text.yml.
# Per aggiungere un paper: una voce in "entries", la sua chiave nella sezione giusta, e i testi nelle tre lingue.
#
# Campi di una voce:
#   icon: working_paper | wip | publication | thesis
#   title, url (link del titolo), coauthors (chiavi di _data/people.yml), series (riga sotto i coautori)
#   links: pillole-link, in quest'ordine: working_paper (url, title) | draft_request (mail precompilata)
#   panels: pillole che aprono una casella, nell'ordine: abstract, keywords, jel, cite
#   jel, bibtex: testo delle caselle JEL e Cite
#   abstract / keywords qui solo se uguali in tutte le lingue; altrimenti nei file delle lingue
#   publication: authors, year, title, url, journal, details — thesis: degree (phd | master | bachelor), year, title

