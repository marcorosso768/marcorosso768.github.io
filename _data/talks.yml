# Pagina talks: struttura comune (sezioni, anni, ordine) e dati che non si traducono.
# I testi tradotti (nome dell'evento, luogo, ruoli, titoli delle sezioni) sono in _data/<lingua>/talks_text.yml.
# Per aggiungere un talk: una voce in "talks", la sua chiave sotto l'anno giusto, e i testi nelle tre lingue.
#
# Campi di un talk:
#   role: speaker | speaker_discussant | discussant
#   paper: chiave del paper in _data/research.yml (il titolo viene da lì); assente se non c'è un paper
#   upcoming: true se l'evento deve ancora svolgersi (mostra "(upcoming)" / "(in programma)" / "(próximamente)")

sections:
