  lecture: "Lecture"
  sections:
    course-info: "información del curso"
    lecture-notes: "apuntes de clase"
    do-files: "do-files"
    dataset: "dataset"
  notes:
    do-files: "Guardá los archivos en una sola carpeta del curso, con la misma estructura que acá: el do-file de setup en <code>do/</code>, los ejercicios en <code>do/exercises/</code>, la simulación en <code>do/ready_to_run/</code> y el dataset en <code>data/</code>. Cada do-file se corre con esa carpeta como directorio de trabajo de Stata."
  details:
    dataset:
      summary: "fuente y licencia"
      body: |
        <p><b>Fuente.</b> World Bank Group, <i>Doing Business</i>, indicadores “Enforcing contracts”. Edición: <i>Doing Business 2020</i> (datos al 1 de mayo de 2019); en los archivos del World Bank ese año figura como “2019”. <a href="https://datacatalog.worldbank.org/search/dataset/0038564/doing-business">Catálogo</a>; descargado el 6 de octubre de 2026 (DB_CSV.zip).</p>
        <p><b>Licencia.</b> <a href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Atribución 4.0 (CC BY 4.0)</a>. Requiere atribución. No implica ningún aval del World Bank.</p>
        <p><b>Cambios.</b> Se seleccionaron 8 series sobre cumplimiento de contratos y 191 economías (las que tienen región en los metadatos de la fuente; se excluyeron los agregados regionales; se incluyó Liechtenstein aunque está fuera del ranking de 190 economías); una fila por economía; variables renombradas y etiquetadas; se sumaron región y grupo de ingreso desde los metadatos. Sin imputación; valores sin cambios.</p>
        <p><b>Alcance.</b> Los indicadores describen una disputa comercial hipotética y estandarizada en la principal ciudad de negocios (promedio de dos ciudades en 11 economías), a partir de cuestionarios a expertos: no son promedios de casos observados. Doing Business se discontinuó en septiembre de 2021, después de que se detectaran irregularidades en los datos de las ediciones 2018 y 2020. Usalos como datos históricos, para la enseñanza. Las etiquetas de región y grupo de ingreso provienen de los metadatos de la fuente.</p>
