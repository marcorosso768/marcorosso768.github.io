    exercises: "ejercicios"
    ready_to_run: "listos para correr"
  notes:
    do-files: "Guardá los archivos en una sola carpeta (por ejemplo, <code>stata/do/</code>), con la misma estructura que acá: <code>00_setup.do</code> en la carpeta misma, los ejercicios en <code>exercises/</code>, sus soluciones en <code>solutions/</code>, la simulación en <code>ready_to_run/</code> y los datasets en <code>data/</code>. Cada do-file se corre con esa carpeta como directorio de trabajo de Stata."
  details:
    contracts_2019:
      summary: "fuente y licencia"
      body: |
        <p><b>Fuente.</b> World Bank Group, <i>Doing Business</i>, indicadores “Enforcing contracts”. Edición: <i>Doing Business 2020</i> (datos al 1 de mayo de 2019); en los archivos del World Bank ese año figura como “2019”. <a href="https://datacatalog.worldbank.org/search/dataset/0038564/doing-business">Catálogo</a>; descargado el 6 de octubre de 2026 (DB_CSV.zip).</p>
        <p><b>Licencia.</b> <a href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Atribución 4.0 (CC BY 4.0)</a>. Requiere atribución. No implica ningún aval del World Bank.</p>
        <p><b>Cambios.</b> Se seleccionaron 8 series sobre cumplimiento de contratos y 191 economías (las que tienen región en los metadatos de la fuente; se excluyeron los agregados regionales; se incluyó Liechtenstein aunque está fuera del ranking de 190 economías); una fila por economía; variables renombradas y etiquetadas; se sumaron región y grupo de ingreso desde los metadatos. Sin imputación; valores sin cambios.</p>
        <p><b>Alcance.</b> Los indicadores describen una disputa comercial hipotética y estandarizada en la principal ciudad de negocios (promedio de dos ciudades en 11 economías), a partir de cuestionarios a expertos: no son promedios de casos observados. Doing Business se discontinuó en septiembre de 2021, después de que se detectaran irregularidades en los datos de las ediciones 2018 y 2020. Usalos como datos históricos, para la enseñanza. Las etiquetas de región y grupo de ingreso provienen de los metadatos de la fuente.</p>
    gdp_2019:
      summary: "fuente y licencia"
      body: |
        <p><b>Fuente.</b> World Bank, <i>World Development Indicators</i>: PIB (dólares corrientes, NY.GDP.MKTP.CD) y población total (SP.POP.TOTL), 2019. Obtenidos de las copias normalizadas en CSV <a href="https://github.com/datasets/gdp">datasets/gdp</a> y <a href="https://github.com/datasets/population">datasets/population</a>; descargados el 13 de octubre de 2026.</p>
        <p><b>Licencia.</b> <a href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Atribución 4.0 (CC BY 4.0)</a>. No implica ningún aval del World Bank.</p>
        <p><b>Cambios.</b> Se conservó 2019; se excluyeron los agregados regionales y por grupo de ingreso; se calculó el PIB per cápita como PIB dividido por población; variables renombradas y etiquetadas. 210 economías, una fila por economía. Los valores de los WDI se revisan con el tiempo: estos corresponden a la versión de abril de 2026.</p>
    justice_europe_2019:
      summary: "fuente y licencia"
      body: |
        <p><b>Fuente.</b> Eurostat, “Personnel in the criminal justice system by sex” (crim_just_job) y “Police-recorded offences by offence category” (crim_off_cat): valores cada cien mil habitantes, ambos sexos, 2019. Ambos datasets actualizados el 29 de abril de 2026; descargados el 13 de octubre de 2026 a través de la API de Eurostat.</p>
        <p><b>Licencia.</b> Reutilización libre según el <a href="https://ec.europa.eu/eurostat/web/main/help/copyright-notice">aviso de copyright de Eurostat</a>, siempre que se cite la fuente y se indiquen los cambios. Los datos de países fuera de la UE, la AELC y los países candidatos pueden tener restricciones para el uso comercial; este archivo es solo para uso didáctico. Los cambios indicados abajo son del docente; Eurostat no es responsable de ellos.</p>
        <p><b>Cambios.</b> Se seleccionaron 2 categorías de personal y 6 categorías de delitos; se conservó 2019; una fila por país (37 países europeos); se unieron por código ISO3 con el tiempo de ejecución de contratos y el índice de calidad judicial de Doing Business 2020 (World Bank, CC BY 4.0) y con el PIB per cápita 2019 del World Bank. Sin imputación; valores sin cambios.</p>
        <p><b>Alcance.</b> Los delitos registrados cuentan los delitos denunciados y registrados por la policía según las definiciones legales de cada país: no miden cuán extendido está el delito. Los jueces profesionales se cuentan según las definiciones nacionales. El Reino Unido y Bosnia y Herzegovina no tienen valores para 2019. Kosovo: esta designación no prejuzga las posiciones sobre su estatus y se ajusta a la resolución 1244/1999 del Consejo de Seguridad de la ONU y a la opinión de la Corte Internacional de Justicia sobre la declaración de independencia de Kosovo.</p>
