entries:
  ai-labor-demand:
    abstract: >-
      Estudiamos cómo el lanzamiento de ChatGPT afectó la demanda laboral publicada en Estados Unidos, separando la
      cantidad de vacantes que las empresas publican de su composición por seniority. Con 314 millones de avisos de
      empleo (2016–2025) y una medida de exposición a los LLM anclada en el uso efectivo, comparamos ocupaciones
      dentro del mismo sector, mercado metropolitano y mes a lo largo de cuatro regímenes: prepandemia, shock
      pandémico, recuperación pospandemia y poslanzamiento. Entre la recuperación de marzo de 2021–octubre de 2022 y
      el período posterior al lanzamiento, la brecha en los avisos entre las ocupaciones del cuartil de mayor
      exposición y el resto se amplía 6,8 puntos logarítmicos. La contracción crece hasta 2025, resiste los
      controles por trabajo remoto y la predice el uso observado de los LLM, más allá de las medidas ex ante de lo
      que los LLM pueden hacer. La composición por seniority ya se había movido antes del lanzamiento: entre los
      avisos que nuestro clasificador asigna a un nivel de seniority, la proporción junior en las ocupaciones
      expuestas cayó alrededor de 3,5 puntos porcentuales respecto del resto entre principios de 2021 y el trimestre
      previo a ChatGPT, y alrededor de 1,5 de esos puntos se explican por la exposición al trabajo remoto. Después
      del lanzamiento, la proporción queda 0,4 puntos por debajo del último trimestre previo, una diferencia que no
      se puede distinguir de cero. La proporción junior sí cayó en las ocupaciones expuestas respecto del resto,
      pero en los dos años anteriores al lanzamiento; hasta ahora, el efecto medible de la IA generativa está en la
      cantidad de vacantes.
    keywords: "IA generativa; ChatGPT; demanda laboral; seniority; avisos de empleo; diferencias en diferencias."
  labels-outcomes:
    abstract: >-
      Una etiqueta leída en el texto de un aviso de empleo es un resultado: las empresas pueden cambiar la redacción
      sin cambiar el puesto. La seniority es una etiqueta de ese tipo, así que una estimación de diferencias en
      diferencias sobre un conteo de avisos etiquetados como junior mezcla un componente de demanda publicada con un
      componente de etiquetado, debido a la redacción y a los errores del clasificador. La tasa de etiquetado, es
      decir, la proporción de avisos que un clasificador etiqueta, identifica como máximo la parte común a todos los
      niveles; el resto requiere etiquetas de referencia en una muestra estratificada por grupo de tratamiento,
      período y nivel asignado, incluidos los avisos sin etiqueta. Proponemos un estimador y una regla de
      asignación; la mayoría de las etiquetas de referencia va a los estratos sin etiqueta. Sobre 314 millones de
      avisos de Estados Unidos, después del lanzamiento de ChatGPT la tasa de etiquetado de un clasificador basado
      en reglas se mueve menos de un punto logarítmico en el panel de la aplicación empírica, sin diferenciarse de
      cero; una tasa basada en los años de experiencia requeridos, reconstruida a partir del texto, sube alrededor
      de 5 puntos logarítmicos desde la pandemia. Con 252 etiquetas humanas, el cambio corregido en la proporción
      junior queda indeterminado: su signo depende de la lectura del modelo que se usa como insumo. En las
      simulaciones, errores fijos del clasificador generan un componente específico de cada nivel de alrededor de 15
      puntos logarítmicos con las tasas de error supuestas, y las muestras de validación del tamaño habitual rara
      vez detectan un reetiquetado.
    keywords: "avisos de empleo; medición a partir de texto; seniority; puestos de entrada; IA generativa; modelos de lenguaje de gran escala; identificación parcial."
  tipping-point:
    abstract: >-
      La posibilidad de aceptar un soborno atrae a quienes lo aceptarían y aleja a quienes tendrían que seguir
      rechazándolo. Estudio ambos efectos en un modelo de elección ocupacional en el que el costo de resistir
      responde al soborno, que se recibe en el momento, y no a una sanción que llega después. Primero, considérese
      un soborno sin sanciones y supóngase que algunas personas con una integridad casi nula están cerca de la
      indiferencia respecto de ingresar. Un soborno pequeño reduce entonces la cantidad de personas que quieren un
      empleo público cuando la proporción del valor de la honestidad que se percibe en el momento de elegir es lo
      bastante baja, y el umbral depende, a primer orden, de los dos parámetros de la tentación, no de la
      distribución de tipos. Segundo, el tamaño no revela la composición: donde un aumento marginal del soborno deja
      la dotación sin cambios, reemplaza ingresantes honestos por corruptos, y cerca de ese punto el sector puede
      achicarse y empeorar a la vez. Tercero, entre reformas que reducen en la misma medida la ganancia neta de la
      corrupción, eliminar la oportunidad deja una proporción de corruptos no mayor que una sanción diferida, con un
      salario dado y con un número fijo de puestos; con puestos fijos, un costo de resistir lineal o convexo y
      reformas pequeñas, dejar que las personas elijan si ingresar solo puede reducir la ventaja relativa de la
      prevención. Con sobornos que aumentan con la proporción de corruptos entre quienes ocupan los puestos, el
      ordenamiento se traslada a los estados estacionarios, y la prevención puede eliminar un estado estacionario de
      alta corrupción que una sanción equivalente mantiene.
    keywords: "selección ocupacional; autocontrol y tentación; corrupción; disuasión; mercados laborales del sector público; equilibrios múltiples."
  crime-voting:
    abstract: >-
      Este trabajo estudia cómo la exposición a noticias policiales geolocalizadas incide en el comportamiento
      electoral individual en las elecciones italianas. A partir de un panel de votantes que no cambian de
      residencia, observados a lo largo de varias rondas electorales, explotamos la variación intraindividual en
      la exposición a noticias policiales cercanas durante el mes previo a la elección, con efectos fijos
      individuales y de distrito por elección. La exposición agregada arroja efectos débiles e inestables. La
      desagregación según la nacionalidad del autor del delito revela patrones sistemáticos: las noticias de
      delitos atribuidos a inmigrantes reducen el apoyo a los partidos con posiciones ambiguas sobre la
      inmigración (por ejemplo, el Movimiento Cinco Estrellas) y aumentan el apoyo a los partidos claramente de
      “mano dura”, mientras que los delitos atribuidos a italianos tienen efectos insignificantes. Los efectos son
      más fuertes entre los votantes de alta calificación que se alejan del M5S y entre los de baja calificación
      que abandonan la Lega. En las elecciones locales, los delitos cometidos por italianos castigan a los
      oficialismos, mientras que los cometidos por inmigrantes aumentan la abstención. Estas respuestas
      asimétricas, ausentes en las medidas agregadas, indican que la saliencia del delito opera sobre todo a
      través de un encuadre identitario más que de una preocupación general por el delito o la seguridad. Los
      resultados muestran cómo la atribución mediática de los delitos moldea la rendición de cuentas electoral.
    keywords: "crimen; inmigración; elecciones; medios de comunicación; comportamiento electoral individual."
  childbirth-turnout:
    abstract: >-
      El nacimiento de un hijo es un shock transitorio que afecta a dos votantes de un mismo hogar. Me pregunto cómo
      se reparte dentro de la pareja el cambio en la participación electoral que provoca. Uso registros
      administrativos de participación de cuatro elecciones en Bolonia (2004–2013), vinculados a padrones de
      población que conectan a ambos progenitores con el mismo nacimiento. Se vota en persona en días fijos, y la
      única facilidad en torno al nacimiento es el voto en el hospital para quien está internado. Comparo las
      parejas cuyo hijo nace justo antes de la votación con aquellas cuyo hijo nace justo después. La pérdida de
      votos proviene sobre todo de los nacimientos de la última semana previa a la votación. Respecto de las parejas
      cuyo hijo nace en las cuatro semanas posteriores, estas parejas emiten 33,9 votos menos cada 100 parejas, y la
      probabilidad de que voten ambos progenitores es 23,6 puntos menor; el voto exclusivo del padre y la abstención
      de ambos son cada uno unos diez puntos más probables, mientras que el voto de la madre sola apenas cambia; el
      aumento de las parejas en las que no vota ninguno está en línea con lo que implican las pérdidas de ambos
      progenitores si el vínculo entre sus decisiones no cambia. Para los nacimientos ocurridos entre ocho y 28 días
      antes de la votación, las diferencias son mucho menores. Un segundo diseño, descriptivo, sigue a las parejas
      alrededor del nacimiento de su primer hijo: en el primer mes posterior al nacimiento su participación está por
      debajo de su propio nivel previo, y a partir del tercer mes la brecha entre la participación de la madre y la
      del padre vuelve a acercarse a su valor previo al nacimiento, mientras que el voto conjunto se mantiene
      levemente por debajo. Por eso, las medidas que facilitan el voto en torno al nacimiento deberían evaluarse por
      su efecto sobre la participación de ambos progenitores.
    keywords: "participación electoral; costos del voto; nacimiento; parejas; hogar; género; participación política."
  childcare-turnout:
    abstract: >-
      ¿Vivir cerca de un bien público provisto localmente aumenta la participación electoral de los hogares a los
      que sirve? Estudiamos los servicios públicos de cuidado infantil en Bolonia, Italia, con registros
      administrativos de participación electoral en cuatro elecciones (2004–2013), vinculados a los registros de
      población y a un censo georreferenciado de establecimientos. Seguimos a padres y madres con un solo hijo desde
      el jardín maternal hasta el jardín de infantes y luego la escuela primaria estatal, de modo que el
      establecimiento relevante, y su distancia al hogar, cambia con la edad del hijo. Si la cercanía lleva a los
      padres a pedirle cuentas al municipio, la participación debería caer con la distancia a los servicios
      municipales (jardín maternal y jardín de infantes) solo en las elecciones locales, y no con la distancia a la
      escuela primaria estatal. En la especificación de base, que sigue a cada padre o madre a lo largo de las
      elecciones, la participación no cae con la distancia. Las pruebas de equivalencia descartan efectos mayores a
      0,56 puntos porcentuales cada 100 metros, es decir, 1,5 puntos sobre el rango intercuartílico de la distancia:
      sobre ese rango, quedan descartados efectos tan grandes como la caída de 2,6 puntos, ya documentada, en la
      participación de las madres entre uno y dos años después del nacimiento del primer hijo. Los efectos de un
      punto, no. Dentro de la precisión de los datos, la cercanía tampoco modifica la caída de la participación
      asociada a tener hijos. Cuando además se compara a los padres dentro de la misma sección electoral y la misma
      elección, la participación en las elecciones locales cae con la distancia a la escuela estatal y, entre los
      padres que no cambiaron de domicilio, con la distancia a los servicios municipales. Ambas caídas son
      significativas solo en 2009, pero no se distinguen de las de 2004. Dado que la escuela estatal también muestra
      esa caída y los niveles municipal y estatal no pueden distinguirse, el diseño no permite ni atribuirla a la
      rendición de cuentas ni descartar esa lectura. Las estimaciones acotan el efecto de vivir cerca de un
      establecimiento, no el de obtener una vacante en él.
    keywords: "participación electoral; bienes públicos; cuidado infantil; género; elecciones locales."
