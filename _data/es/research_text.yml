entries:
  ai-labor-demand:
    abstract: >-
      Estudiamos cómo el lanzamiento de ChatGPT afectó la demanda laboral publicada en Estados Unidos, utilizando
      368 millones de avisos de empleo de Lightcast (2016–2025) y una medida de exposición a los LLM anclada en el
      uso efectivo. Si bien encontramos un efecto negativo y causal sobre el volumen de avisos en las ocupaciones
      expuestas a la IA, no hallamos ningún efecto posterior al lanzamiento sobre su composición por antigüedad.
      Después de noviembre de 2022, el volumen de avisos en las ocupaciones del cuartil superior de exposición se
      contrae 9 puntos logarítmicos (aproximadamente 8,6 por ciento) respecto de las ocupaciones menos expuestas
      dentro del mismo mercado metropolitano y mes. La estimación resiste una amplia batería de controles de
      robustez y se concentra en el uso medido de los LLM más que en la capacidad de la IA. En las ocupaciones
      expuestas, los avisos junior caen bastante más que los senior tras el lanzamiento, pero la divergencia es
      anterior a ChatGPT: se abre en 2021–22, durante la recuperación de la COVID, y no muestra un quiebre en el
      momento del lanzamiento. El diferencial que una simple comparación antes/después atribuiría a ChatGPT queda
      absorbido por la exposición predeterminada al trabajo remoto. Nuestros resultados advierten contra leer las
      caídas en puestos de entrada basadas en la exposición como evidencia de un cambio tecnológico sesgado por
      antigüedad impulsado por la IA.
    keywords: "IA generativa; ChatGPT; demanda laboral; antigüedad; avisos de empleo; diferencias en diferencias."
  tipping-point:
    abstract: >-
      Las oportunidades de corrupción atraen a quienes las aprovecharían y alejan a quienes anticipan el costo de
      resistirlas. Estudio ambos márgenes en un modelo de elección ocupacional con costos de autocontrol. Se
      destacan tres resultados. Primero, cuando la tentación es fuerte, rentas de corrupción pequeñas pueden achicar
      el grupo de quienes ingresan. Segundo, el sector público puede perder integridad mientras se reduce, de modo
      que una dotación estable o en baja puede ocultar un plantel que se deteriora. Tercero, con igual excedente
      neto de la corrupción, eliminar las oportunidades de corrupción genera una corrupción débilmente menor que las
      sanciones diferidas, tanto con un salario dado como con un número fijo de puestos. Cuando las rentas aumentan
      con la proporción de corruptos entre quienes ocupan los puestos, el ordenamiento se traslada a los estados
      estacionarios, y la prevención puede eliminar un equilibrio de alta corrupción que una sanción equivalente
      mantiene.
    keywords: "selección ocupacional; autocontrol y tentación; corrupción; disuasión; mercados laborales del sector público; equilibrios múltiples."
  crime-voting:
    abstract: >-
      Este trabajo analiza si la exposición a noticias policiales geolocalizadas modifica el comportamiento
      electoral individual en las elecciones italianas. A partir de un panel de votantes boloñeses que no cambian de
      residencia, observados a lo largo de varias rondas electorales, explotamos la variación intraindividual en la
      exposición a noticias policiales cercanas durante el mes previo a la elección, manteniendo constantes los
      efectos fijos individuales y de elección. La exposición agregada a noticias policiales arroja asociaciones
      débiles e imprecisas. La desagregación por nacionalidad percibida del autor del delito revela una asimetría
      marcada. En las elecciones nacionales, la exposición a noticias de delitos atribuidos a personas inmigrantes
      cerca del domicilio de quien vota se asocia con una caída intraindividual de alrededor de 2 puntos
      porcentuales en el apoyo al Movimiento Cinco Estrellas, el mayor partido sin una posición clara sobre
      inmigración durante el período analizado, y con un aumento comparable de la abstención; las noticias de
      delitos atribuidos a ciudadanos italianos no presentan una asociación comparable. La respuesta es específica
      del contenido policial: noticias locales comparables ajenas al delito no producen ningún desplazamiento
      análogo. Estas respuestas asimétricas, ausentes en las medidas agregadas, resultan más compatibles con una
      señal de nacionalidad en la cobertura policial que activa un encuadre de inmigración y seguridad que con una
      reacción uniforme a la saliencia del delito. La evidencia señala que lo que importa para el comportamiento
      electoral es la atribución del delito en las noticias locales, más que su mera ocurrencia. Una falsificación
      temporal respalda la lectura ligada a la ventana de campaña, pero es sensible al clasificador de nacionalidad
      del autor; en consecuencia, leemos las estimaciones como asociaciones, con una replicación en fuentes
      alternativas en curso para resolver la interpretación causal.
    keywords: "crimen; inmigración; elecciones; medios de comunicación; comportamiento electoral individual."
  childbirth-turnout:
    abstract: >-
      El nacimiento de un hijo es un shock transitorio que afecta a dos votantes de un mismo hogar. Me pregunto cómo
      se reparte dentro de la pareja el cambio en la participación electoral que provoca. Con registros
      administrativos de participación de Bolonia, donde se vota en persona en días fijos, vinculados a padrones que
      conectan a ambos progenitores con el mismo nacimiento, comparo las parejas cuyo hijo nace en las semanas
      previas a la votación con aquellas cuyo hijo nace después. Las parejas con un hijo nacido en las cuatro
      semanas anteriores a la votación registran 11,5 votos menos cada 100: la probabilidad de que ambos
      progenitores figuren como votantes es nueve puntos menor y la de que vote solo el padre, cinco puntos mayor,
      mientras que el voto de la madre sola apenas cambia. Al excluir los nacimientos más expuestos a una posible
      clasificación errónea de los votos emitidos en el hospital, estas diferencias se reducen, y en la muestra más
      restrictiva solo la diferencia en el voto exclusivo del padre sobrevive a la corrección por pruebas múltiples.
      Respecto de la participación previa al nacimiento de la propia pareja, la participación registrada también es
      menor en el mes del nacimiento, en una comparación descriptiva sensible a las mismas exclusiones. A partir del
      tercer mes, la brecha estimada entre madre y padre vuelve a acercarse a su nivel previo al nacimiento.
    keywords: "participación electoral; costos del voto; nacimiento; parejas; hogar; género; participación política."
  childcare-turnout:
    abstract: >-
      ¿La cercanía a bienes públicos de provisión local aumenta la participación política de los hogares a los que
      están destinados? Estudiamos Bolonia, Italia, con registros administrativos de participación de todas las
      personas habilitadas para votar en cuatro elecciones (2004–2013), vinculados a los padrones anuales de
      población, al ingreso, a las fechas exactas de nacimiento y a un censo geocodificado de establecimientos de
      cuidado infantil construido para este trabajo. Nuestra especificación de base sigue a madres y padres con un
      hijo conviviente en el padrón anual a medida que el hijo crece y atraviesa distintos regímenes de servicio, de
      modo que la distancia relevante cambia dentro de la misma persona, y estima pendientes de distancia separadas
      para las elecciones locales y nacionales. La pendiente de distancia a los establecimientos municipales en las
      elecciones locales es estadísticamente indistinguible de cero, con una cota de equivalencia simétrica de 0,47
      puntos porcentuales por cada 100 metros, o 1,25 puntos a lo largo del rango intercuartílico de la distancia.
      El contraste local–nacional que restringe la hipótesis de rendición de cuentas se estima con menor precisión:
      su cota es de 0,79 puntos por cada 100 metros, y efectos moderados sobre él siguen siendo compatibles con la
      evidencia. La cercanía no modera de manera detectable la penalidad por maternidad y paternidad, ninguna
      interacción por género sobrevive al ajuste por multiplicidad, y una cohorte que cambia de régimen y otros seis
      servicios y equipamientos locales arrojan el mismo resultado. Un contraste marginal anterior entre madres y
      padres con continuidad de domicilio verificada no es robusto a la especificación y se reporta como
      exploratorio. El estimando es la cercanía: las estimaciones acotan el efecto movilizador de vivir cerca de un
      establecimiento y dejan sin medir el de obtener una vacante en él.
    keywords: "participación electoral; bienes públicos; cuidado infantil; género; elecciones locales."
