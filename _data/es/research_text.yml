entries:
  ai-labor-demand:
    abstract: >-
      Estudiamos cómo el lanzamiento de ChatGPT afectó la demanda laboral publicada en Estados Unidos, separando la
      cantidad de vacantes que las empresas publican de su composición por antigüedad. Con 314 millones de avisos de
      empleo (2016–2025) y una medida de exposición a los LLM anclada en el uso efectivo, comparamos ocupaciones
      dentro del mismo sector, mercado metropolitano y mes a lo largo de cuatro regímenes: prepandemia, shock
      pandémico, recuperación pospandemia y poslanzamiento. Entre la recuperación de marzo de 2021–octubre de 2022 y
      el período posterior al lanzamiento, la brecha en los avisos entre las ocupaciones del cuartil de mayor
      exposición y el resto se amplía 6,8 puntos logarítmicos. La contracción crece hasta 2025, resiste los
      controles por trabajo remoto y la predice el uso observado de los LLM, más allá de las medidas ex ante de lo
      que los LLM pueden hacer. La composición por antigüedad ya se había movido antes del lanzamiento: entre los
      avisos que nuestro clasificador asigna a un nivel de antigüedad, la proporción junior en las ocupaciones
      expuestas cayó alrededor de 3,5 puntos porcentuales respecto del resto entre principios de 2021 y el trimestre
      previo a ChatGPT, y alrededor de 1,5 de esos puntos se explican por la exposición al trabajo remoto. Después
      del lanzamiento, la proporción queda 0,4 puntos por debajo del último trimestre previo, una diferencia que no
      se puede distinguir de cero. La proporción junior sí cayó en las ocupaciones expuestas respecto del resto,
      pero en los dos años anteriores al lanzamiento; hasta ahora, el efecto medible de la IA generativa está en la
      cantidad de vacantes.
    keywords: "IA generativa; ChatGPT; demanda laboral; antigüedad; avisos de empleo; diferencias en diferencias."
  labels-outcomes:
    abstract: >-
      Una etiqueta leída en el texto de un aviso de empleo es un resultado: las empresas estudiadas pueden cambiar
      la redacción sin cambiar el puesto. La antigüedad es una etiqueta de ese tipo, así que una estimación de
      diferencias en diferencias sobre un conteo de avisos etiquetados como junior mezcla un componente de demanda
      publicada con un componente de etiquetado, debido a la redacción de las empresas y a los errores del
      clasificador. La proporción de avisos que un clasificador etiqueta, su tasa de etiquetado, identifica como
      máximo la parte de ese componente común a todos los niveles; la parte que mueve avisos entre niveles requiere
      etiquetas de referencia en una muestra estratificada por grupo de tratamiento, período y nivel asignado,
      incluidos los avisos sin etiqueta. Proponemos un estimador y una regla de asignación que ubica la mayoría de
      las etiquetas de referencia en los estratos sin etiqueta. Sobre 314 millones de avisos de Estados Unidos en
      torno al lanzamiento de ChatGPT, la tasa de etiquetado de un clasificador basado en reglas se mueve después
      del lanzamiento como máximo alrededor de medio punto porcentual en cualquier año respecto de la recuperación,
      menos de un punto logarítmico y sin diferenciarse de cero. Para la lectura basada en los años de experiencia
      requeridos, que está detrás de los campos estructurados de los proveedores de datos, sube alrededor de 5
      puntos logarítmicos, a partir de la pandemia. Con 252 etiquetas humanas, el signo del cambio corregido en la
      proporción junior depende de qué lectura del modelo se corrige. En un ejercicio semisintético, un clasificador
      con errores fijos genera un componente específico de cada nivel de alrededor de 15 puntos logarítmicos solo
      por cambios en el tamaño de los estratos, y muestras de validación del tamaño habitual detectan un
      reetiquetado inyectado como máximo en una de cada cinco réplicas.
    keywords: "avisos de empleo; medición a partir de texto; antigüedad; puestos de entrada; IA generativa; modelos de lenguaje de gran escala; identificación parcial."
  tipping-point:
    abstract: >-
      La posibilidad de aceptar un soborno atrae a quienes lo aceptarían y aleja a quienes tendrían que seguir
      rechazándolo. Estudio ambos efectos en un modelo de elección ocupacional en el que el costo de resistir
      responde al soborno, que se recibe en el momento, y no a una sanción que llega después. Primero, un soborno
      pequeño reduce la cantidad de personas que quieren un empleo público cuando la proporción del valor de la
      honestidad que se percibe en el momento de elegir es lo bastante baja; a primer orden, el umbral depende de
      los dos parámetros de la tentación, no de la distribución de tipos. Segundo, el tamaño no revela la
      composición: en ese umbral la dotación no cambia mientras los ingresantes honestos son reemplazados por
      corruptos, y apenas por encima el sector se achica y empeora a la vez. Tercero, entre reformas que reducen en
      la misma medida la ganancia neta de la corrupción, eliminar la oportunidad deja una proporción de corruptos no
      mayor que una sanción diferida, con un salario dado y con un número fijo de puestos; con puestos fijos, dejar
      que las personas elijan si ingresar diluye esta ventaja y nunca la amplifica. Con sobornos que aumentan con la
      proporción de corruptos entre quienes ocupan los puestos, el ordenamiento se traslada a los estados
      estacionarios, y la prevención puede eliminar un estado estacionario de alta corrupción que una sanción
      equivalente mantiene.
    keywords: "selección ocupacional; autocontrol y tentación; corrupción; disuasión; mercados laborales del sector público; equilibrios múltiples."
  crime-voting:
    abstract: >-
      Este trabajo analiza si la exposición a noticias policiales geolocalizadas modifica el comportamiento
      electoral individual en las elecciones italianas. A partir de un panel de votantes boloñeses que no cambian de
      residencia, observados a lo largo de varias rondas electorales, explotamos la variación intraindividual en la
      exposición a noticias policiales cercanas durante el mes previo a la elección, manteniendo constantes los
      efectos fijos individuales y de elección. La exposición agregada a noticias policiales arroja asociaciones
      débiles e imprecisas. La desagregación por nacionalidad percibida del autor del delito revela una asimetría
      marcada. En las elecciones nacionales, la exposición a noticias de delitos atribuidos a personas inmigrantes
      cerca del domicilio de quien vota se asocia con una caída intraindividual de alrededor de 2 puntos
      porcentuales en el apoyo al Movimiento Cinco Estrellas, el mayor partido sin una posición clara sobre
      inmigración durante el período analizado, y con un aumento comparable de la abstención; las noticias de
      delitos atribuidos a ciudadanos italianos no presentan una asociación comparable. La respuesta es específica
      del contenido policial: noticias locales comparables ajenas al delito no producen ningún desplazamiento
      análogo. Estas respuestas asimétricas, ausentes en las medidas agregadas, resultan más compatibles con una
      señal de nacionalidad en la cobertura policial que activa un encuadre de inmigración y seguridad que con una
      reacción uniforme a la saliencia del delito. La evidencia señala que lo que importa para el comportamiento
      electoral es la atribución del delito en las noticias locales, más que su mera ocurrencia. Una falsificación
      temporal respalda la lectura ligada a la ventana de campaña, pero es sensible al clasificador de nacionalidad
      del autor; en consecuencia, leemos las estimaciones como asociaciones, con una replicación en fuentes
      alternativas en curso para resolver la interpretación causal.
    keywords: "crimen; inmigración; elecciones; medios de comunicación; comportamiento electoral individual."
  childbirth-turnout:
    abstract: >-
      El nacimiento de un hijo es un shock transitorio que afecta a dos votantes de un mismo hogar. Me pregunto cómo
      se reparte dentro de la pareja el cambio en la participación electoral que provoca. Uso registros
      administrativos de participación de cuatro elecciones en Bolonia (2004–2013), vinculados a padrones de
      población que conectan a ambos progenitores con el mismo nacimiento. Se vota en persona en días fijos, y la
      única alternativa es el voto en el hospital para quien está internado. Comparo las parejas cuyo hijo nace
      justo antes de la votación con aquellas cuyo hijo nace justo después. La pérdida de votos proviene de los
      nacimientos de la última semana previa a la votación. Respecto de las parejas cuyo hijo nace en las cuatro
      semanas posteriores, estas parejas emiten 33,9 votos menos cada 100 parejas (sobre un máximo de 200), y la
      probabilidad de que voten ambos progenitores es 23,6 puntos menor; el voto exclusivo del padre y la abstención
      de ambos son cada uno unos diez puntos más probables, mientras que el voto de la madre sola apenas cambia. La
      mayor parte de la abstención adicional de los padres varones se da en parejas en las que la madre también se
      abstiene, pero los datos no permiten saber si el nacimiento cambia la dependencia entre las decisiones de
      ambos miembros de la pareja. Para los nacimientos ocurridos entre ocho y 28 días antes de la votación, las
      diferencias son mucho menores. Un segundo diseño, descriptivo, sigue a las parejas alrededor del nacimiento de
      su primer hijo: en el primer mes posterior al nacimiento su participación está por debajo de su propio nivel
      previo, y a partir del tercer mes la brecha entre la participación de la madre y la del padre vuelve a
      acercarse a su valor previo al nacimiento. Por eso, las medidas que facilitan el voto en torno al nacimiento
      deberían evaluarse por su efecto sobre la participación de ambos progenitores.
    keywords: "participación electoral; costos del voto; nacimiento; parejas; hogar; género; participación política."
  childcare-turnout:
    abstract: >-
      ¿Vivir cerca de un bien público provisto localmente aumenta la participación electoral de los hogares a los
      que sirve? Estudiamos los servicios públicos de cuidado infantil en Bolonia, Italia, con registros
      administrativos de participación electoral en cuatro elecciones (2004–2013), vinculados a los registros de
      población y a un censo georreferenciado de establecimientos. Seguimos a padres y madres con un solo hijo desde
      el jardín maternal hasta el jardín de infantes y luego la escuela primaria estatal, de modo que el
      establecimiento relevante, y su distancia al hogar, cambia con la edad del hijo. Si la cercanía lleva a los
      padres a pedirle cuentas al municipio, la participación debería caer con la distancia a los servicios
      municipales (jardín maternal y jardín de infantes) solo en las elecciones locales, y no con la distancia a la
      escuela primaria estatal. En la especificación de base, que sigue a cada padre o madre a lo largo de las
      elecciones, la participación no cae con la distancia. Las pruebas de equivalencia descartan efectos mayores a
      0,56 puntos porcentuales cada 100 metros, es decir, 1,5 puntos sobre el rango intercuartílico de la distancia:
      sobre ese rango, quedan descartados efectos tan grandes como la caída de 2,6 puntos, ya documentada, en la
      participación de las madres entre uno y dos años después del nacimiento del primer hijo. Los efectos de un
      punto, no. Dentro de la precisión de los datos, la cercanía tampoco modifica la caída de la participación
      asociada a tener hijos. Cuando además se compara a los padres dentro de la misma sección electoral y la misma
      elección, la participación en las elecciones locales cae con la distancia a la escuela estatal y, entre los
      padres que no cambiaron de domicilio, con la distancia a los servicios municipales. Ambas caídas son
      significativas solo en 2009, pero no se distinguen de las de 2004. Dado que la escuela estatal también muestra
      esa caída y los niveles municipal y estatal no pueden distinguirse, el diseño no permite ni atribuirla a la
      rendición de cuentas ni descartar esa lectura. Las estimaciones acotan el efecto de vivir cerca de un
      establecimiento, no el de obtener una vacante en él.
    keywords: "participación electoral; bienes públicos; cuidado infantil; género; elecciones locales."
