          title: "Exporting OLS Regression Results in Stata"
        - file: "Marginal_Effects_and_Maximum_Likelihood_Tests.pdf"
          title: "Marginal Effects in Logit and Probit Models and Maximum Likelihood Tests"
        - file: "Data_Scaling_Functional_Forms_APE_and_Goodness_of_Fit.pdf"
          title: "Data Scaling, Functional Forms, APE, and Goodness-of-Fit in Logit and Probit"
        - file: "Goodness_of_Fit_and_ML_Hypothesis_Testing.pdf"
          title: "Goodness-of-Fit & ML Hypothesis Testing"
        - file: "How_to_Develop_an_Economics_Research_Paper.pdf"
          title: "How to Develop an Economics Research Paper"
        - file: "Review_Session_pt1.pdf"
          title: "Review Session: Probability and Statistics Review, Linear Regression Models, and OLS Inference"
        - file: "Review_Session_pt2.pdf"
          title: "Review Session: Heteroskedasticity, Logit and Probit Models, Maximum Likelihood Estimation, and Inference based on Maximum Likelihood"
    - key: do-files
      id: content-2
      icon: fa-solid fa-code
      items:
        - file: "Introduction_to_Stata.do"
          title: "Introduction to Stata.do"
        - file: "Exporting_OLS_Regression_Results_in_Stata.do"
          title: "Template: Exporting OLS Regression Results in Stata.do"
