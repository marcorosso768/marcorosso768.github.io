python_for_economists:
  folder: /assets/teaching_material/python_for_economists/
  viewer: https://nbviewer.org/github/marcorosso768/marcorosso768.github.io/blob/master # i notebook si aprono qui
  sections:
    - key: notebooks
      id: content-0
      icon: fa-brands fa-python
      blocks:
        - id: subsection-block-i
          title: "Block I: Python for economic data"
          items:
            - notebook: "L1_setup_syntax.ipynb"
              title: "Setup & Python Syntax"
              lecture: 1
            - notebook: "L2_data_structures.ipynb"
              title: "Data Structures & Object-Oriented Programming"
              lecture: 2
            - notebook: "L3_pandas_apis_econometrics.ipynb"
              title: "Pandas, APIs & Econometrics"
              lecture: 3
            - notebook: "L4_viz_eda_dp.ipynb"
              title: "Visualisation, EDA & Dynamic Optimisation"
              lecture: 4
        - id: subsection-block-ii
          title: "Block II: Data collection from the web"
          items:
            - notebook: "L5_webscraping1.ipynb"
              title: "Web Scraping I: requests & BeautifulSoup"
              lecture: 5
            - notebook: "L6_webscraping2.ipynb"
              title: "Web Scraping II: Sessions, Headers & Selenium"
              lecture: 6
        - id: subsection-block-iii
          title: "Block III: NLP and Machine Learning for Text"
          items:
            - notebook: "L7_nlp_representation.ipynb"
              title: "NLP: Text Representation"
              lecture: 7
            - notebook: "L8_sentiment_topics.ipynb"
              title: "Sentiment Analysis & Supervised ML for Text"
              lecture: 8
            - notebook: "L9_ml_llms.ipynb"
              title: "Machine Learning for Text & LLMs via API"
              lecture: 9
    - key: extra
      id: content-1
      icon: fa-brands fa-python
      items:
        - notebook: "E1_reproducibility.ipynb"
