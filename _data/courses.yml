# Pagine dei materiali dei corsi (_pages/<lingua>/courses/): struttura comune e dati che non si traducono.
# I testi tradotti (titoli delle sezioni, titoli dei file tradotti, "Lecture", date) sono in _data/<lingua>/courses_text.yml.
# Per aggiungere un file: una voce nella sezione giusta; se il titolo cambia con la lingua, va nei tre courses_text.yml
# (sotto titles, con il nome del file come chiave) invece che qui.
#
# Campi di un file:
#   file: nome del file nella cartella del corso (gli spazi diventano %20 nel link), oppure percorso completo
#     /assets/... per un file che sta nella cartella di un altro corso
#   notebook: nome del notebook .ipynb (link al visualizzatore indicato in viewer, più il pulsante per scaricarlo)
#   title: titolo, se è uguale in tutte le lingue
#   lecture: numero della lezione (mostra "Lecture 3:" / "Lezione 3:" / "Clase 3:")
#   prefix: etichetta fissa prima del titolo, uguale in tutte le lingue (es. "Extra L1")
#   icon: icona del solo file, se diversa da quella della sezione (es. uno script tra i dati)
#   updated: data dell'ultimo aggiornamento, AAAA-MM oppure AAAA-MM-GG
#   translations: lo stesso documento in un'altra lingua, per lingua del sito (percorso completo del file); nelle
#     pagine di quelle lingue il link punta lì invece che a file. Il titolo resta quello di courses_text.yml.
# Una sezione ha items oppure blocks (sottosezioni con titolo, id e items); icon è l'icona di tutti i suoi file.
# Una sezione può avere sia items (in cima, es. il setup) sia blocks (es. le settimane).
# Se courses_text.yml ha un testo sotto notes con la chiave della sezione, compare come nota sotto l'elenco
# (sopra, con note_first: true); un testo sotto details compare in fondo, come dettagli che si aprono.
# Un blocco può avere groups (key + items) invece di items: file divisi sotto sottotitoli fissi (testi in courses_text.yml, groups).
# Un esercizio può avere solution: <file nella cartella del corso>: link "solution" sulla stessa riga.
# Un file può avere do_file: <file nella cartella del corso>: link "do-file" sulla stessa riga.
# Una voce può essere solo testo: note: <chiave> (courses_text.yml, notes.<chiave>), con l'icona della sezione.
# Un singolo file può avere details: <chiave>: i dettagli (courses_text.yml, details.<chiave>) compaiono sotto il file.

