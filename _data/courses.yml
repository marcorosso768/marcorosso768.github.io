        - notebook: "E2_complexity_vectorization.ipynb"
          title: "Data Structures, Complexity, and Vectorization"
          prefix: "Extra L2"
        - notebook: "E3_pandas_integrity.ipynb"
          title: "Pandas Joins, Keys, and Data Integrity"
          prefix: "Extra L3"
        - notebook: "E4_visualization_bias.ipynb"
          title: "Visualization, EDA, and How Plots Can Mislead"
          prefix: "Extra L4"
        - notebook: "E5_scraping_robustness.ipynb"
          title: "Web Scraping Robustness and HTML Fragility"
          prefix: "Extra L5"
        - notebook: "E6_api_vs_scraping.ipynb"
          title: "APIs vs Scraping, Pagination, and Rate Limits"
          prefix: "Extra L6"
