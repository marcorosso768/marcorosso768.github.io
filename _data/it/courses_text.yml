empirical_methods_for_law_and_economics:
  lecture: "Lecture"
  sections:
    course-info: "informazioni sul corso"
    lecture-notes: "dispense"
    do-files: "do-file"
    dataset: "dataset"
  groups: # sottotitoli fissi dentro le settimane dei do-file
    exercises: "esercizi"
    ready_to_run: "pronti da eseguire"
  notes:
    do-files: "I file vanno tenuti in un'unica cartella del corso, con la stessa struttura di questa pagina: <code>00_setup.do</code> nella cartella stessa, gli esercizi in <code>exercises/</code>, le soluzioni in <code>solutions/</code>, la simulazione in <code>ready_to_run/</code> e i dataset in <code>data/</code>. Ogni do-file va eseguito con quella cartella come directory di lavoro di Stata."
  details:
    contracts_2019:
      summary: "fonte e licenza"
      body: |
        <p><b>Fonte.</b> Gruppo Banca Mondiale, <i>Doing Business</i>, indicatori “Enforcing contracts”. Edizione: <i>Doing Business 2020</i> (dati al 1° maggio 2019); nei file della Banca Mondiale quest’anno è indicato come “2019”. <a href="https://datacatalog.worldbank.org/search/dataset/0038564/doing-business">Catalogo</a>; scaricato il 6 ottobre 2026 (DB_CSV.zip).</p>
        <p><b>Licenza.</b> <a href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Attribuzione 4.0 (CC BY 4.0)</a>. È richiesta l’attribuzione. La Banca Mondiale non avalla in alcun modo questo uso dei dati.</p>
        <p><b>Modifiche.</b> Selezionate 8 serie sull’esecuzione dei contratti e 191 economie (quelle con una regione nei metadati della fonte; esclusi gli aggregati regionali; incluso il Liechtenstein, pur fuori dalla classifica delle 190 economie); una riga per economia; variabili rinominate ed etichettate; aggiunte regione e fascia di reddito dai metadati. Nessuna imputazione; valori invariati.</p>
        <p><b>Ambito.</b> Gli indicatori descrivono una controversia commerciale ipotetica e standardizzata nella principale città d’affari (media di due città per 11 economie), sulla base di questionari a esperti: non sono medie di casi osservati. Doing Business è stato sospeso nel settembre 2021, dopo che erano emerse irregolarità nei dati delle edizioni 2018 e 2020. Vanno usati come dati storici, a fini didattici. Le etichette di regione e fascia di reddito vengono dai metadati della fonte.</p>
    gdp_2019:
      summary: "fonte e licenza"
      body: |
        <p><b>Fonte.</b> Banca Mondiale, <i>World Development Indicators</i>: PIL (dollari correnti, NY.GDP.MKTP.CD) e popolazione totale (SP.POP.TOTL), 2019. Ottenuti dalle copie normalizzate in CSV <a href="https://github.com/datasets/gdp">datasets/gdp</a> e <a href="https://github.com/datasets/population">datasets/population</a>; scaricati il 13 ottobre 2026.</p>
        <p><b>Licenza.</b> <a href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Attribuzione 4.0 (CC BY 4.0)</a>. La Banca Mondiale non avalla in alcun modo questo uso dei dati.</p>
        <p><b>Modifiche.</b> Tenuto il 2019; esclusi gli aggregati regionali e per fascia di reddito; calcolato il PIL pro capite come PIL diviso popolazione; variabili rinominate ed etichettate. 210 economie, una riga per economia. I valori WDI vengono rivisti nel tempo: questi sono quelli della versione di aprile 2026.</p>
    justice_europe_2019:
      summary: "fonte e licenza"
      body: |
        <p><b>Fonte.</b> Eurostat, “Personnel in the criminal justice system by sex” (crim_just_job) e “Police-recorded offences by offence category” (crim_off_cat): valori per centomila abitanti, entrambi i sessi, 2019. Entrambi i dataset aggiornati il 29 aprile 2026; scaricati il 13 ottobre 2026 tramite l’API di Eurostat.</p>
        <p><b>Licenza.</b> Riutilizzo libero secondo l’<a href="https://ec.europa.eu/eurostat/about-us/policies/copyright">avviso sul copyright di Eurostat</a>, a condizione di citare la fonte e di indicare le modifiche. I dati dei paesi esterni all’UE, all’EFTA e ai paesi candidati possono essere soggetti a restrizioni per il riutilizzo commerciale; questo file è solo a uso didattico. Le modifiche indicate sotto sono del docente; Eurostat non ne è responsabile.</p>
        <p><b>Modifiche.</b> Selezionate 2 categorie di personale e 6 categorie di reati; tenuto il 2019; una riga per paese (37 paesi europei); uniti tramite codice ISO3 ai tempi di esecuzione dei contratti e all’indice di qualità giudiziaria di Doing Business 2020 (Banca Mondiale, CC BY 4.0) e al PIL pro capite 2019 della Banca Mondiale. Nessuna imputazione; valori invariati.</p>
        <p><b>Ambito.</b> I reati registrati contano i reati denunciati e registrati dalla polizia secondo le definizioni giuridiche nazionali: non misurano quanto il crimine sia diffuso. I magistrati professionali sono contati secondo le definizioni nazionali. Regno Unito e Bosnia ed Erzegovina non hanno valori per il 2019. Kosovo: questa designazione non pregiudica le posizioni sullo status ed è conforme alla risoluzione 1244/1999 del Consiglio di Sicurezza dell’ONU e al parere della Corte internazionale di giustizia sulla dichiarazione di indipendenza del Kosovo.</p>
