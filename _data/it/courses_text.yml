    dataset: "dataset"
    supplementary: "materiali supplementari"
  groups: # sottotitoli fissi dentro le settimane dei do-file
    exercises: "esercizi"
    ready_to_run: "pronti da eseguire"
    text_corpus: "come costruire il corpus di testi dai PDF"
  notes:
    data-week-3: "Le lezioni 5–6 riusano <code>contracts_2019.dta</code> (settimana 1) e <code>justice_europe_2019.dta</code> (settimana 2)."
    do-files: "I file vanno tenuti in un'unica cartella (per esempio <code>stata/do/</code>), con la stessa struttura di questa pagina: <code>00_setup.do</code> nella cartella stessa, gli esercizi in <code>exercises/</code>, le soluzioni in <code>solutions/</code>, la simulazione in <code>ready_to_run/</code> e i dataset in <code>data/</code>. Ogni do-file va eseguito con quella cartella come directory di lavoro di Stata."
  details:
    contracts_2019:
      summary: "fonte e licenza"
      body: |
        <p><b>Fonte.</b> Gruppo Banca Mondiale, <i>Doing Business</i>, indicatori “Enforcing contracts”. Edizione: <i>Doing Business 2020</i> (dati al 1° maggio 2019); nei file della Banca Mondiale quest’anno è indicato come “2019”. <a href="https://datacatalog.worldbank.org/search/dataset/0038564/doing-business">Catalogo</a>; scaricato il 6 ottobre 2026 (DB_CSV.zip).</p>
        <p><b>Licenza.</b> <a href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Attribuzione 4.0 (CC BY 4.0)</a>. È richiesta l’attribuzione. La Banca Mondiale non avalla in alcun modo questo uso dei dati.</p>
        <p><b>Modifiche.</b> Selezionate 8 serie sull’esecuzione dei contratti e 191 economie (quelle con una regione nei metadati della fonte; esclusi gli aggregati regionali; incluso il Liechtenstein, pur fuori dalla classifica delle 190 economie); una riga per economia; variabili rinominate ed etichettate; aggiunte regione e fascia di reddito dai metadati. Nessuna imputazione; valori invariati.</p>
        <p><b>Ambito.</b> Gli indicatori descrivono una controversia commerciale ipotetica e standardizzata nella principale città d’affari (media di due città per 11 economie), sulla base di questionari a esperti: non sono medie di casi osservati. Doing Business è stato sospeso nel settembre 2021, dopo che erano emerse irregolarità nei dati delle edizioni 2018 e 2020. Vanno usati come dati storici, a fini didattici. Le etichette di regione e fascia di reddito vengono dai metadati della fonte.</p>
    gdp_2019:
      summary: "fonte e licenza"
      body: |
        <p><b>Fonte.</b> Banca Mondiale, <i>World Development Indicators</i>: PIL (dollari correnti, NY.GDP.MKTP.CD) e popolazione totale (SP.POP.TOTL), 2019. Ottenuti dalle copie normalizzate in CSV <a href="https://github.com/datasets/gdp">datasets/gdp</a> e <a href="https://github.com/datasets/population">datasets/population</a>; scaricati il 13 ottobre 2026.</p>
        <p><b>Licenza.</b> <a href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Attribuzione 4.0 (CC BY 4.0)</a>. La Banca Mondiale non avalla in alcun modo questo uso dei dati.</p>
        <p><b>Modifiche.</b> Tenuto il 2019; esclusi gli aggregati regionali e per fascia di reddito; calcolato il PIL pro capite come PIL diviso popolazione; variabili rinominate ed etichettate. 210 economie, una riga per economia. I valori WDI vengono rivisti nel tempo: questi sono quelli della versione di aprile 2026.</p>
    justice_europe_2019:
      summary: "fonte e licenza"
      body: |
        <p><b>Fonte.</b> Eurostat, “Personnel in the criminal justice system by sex” (crim_just_job) e “Police-recorded offences by offence category” (crim_off_cat): valori per centomila abitanti, entrambi i sessi, 2019. Entrambi i dataset aggiornati il 29 aprile 2026; scaricati il 13 ottobre 2026 tramite l’API di Eurostat.</p>
        <p><b>Licenza.</b> Riutilizzo libero secondo l’<a href="https://ec.europa.eu/eurostat/web/main/help/copyright-notice">avviso sul copyright di Eurostat</a>, a condizione di citare la fonte e di indicare le modifiche. I dati dei paesi esterni all’UE, all’EFTA e ai paesi candidati possono essere soggetti a restrizioni per il riutilizzo commerciale; questo file è solo a uso didattico. Le modifiche indicate sotto sono del docente; Eurostat non ne è responsabile.</p>
        <p><b>Modifiche.</b> Selezionate 2 categorie di personale e 6 categorie di reati; tenuto il 2019; una riga per paese (37 paesi europei); uniti tramite codice ISO3 ai tempi di esecuzione dei contratti e all’indice di qualità giudiziaria di Doing Business 2020 (Banca Mondiale, CC BY 4.0) e al PIL pro capite 2019 della Banca Mondiale. Nessuna imputazione; valori invariati.</p>
        <p><b>Ambito.</b> I reati registrati contano i reati denunciati e registrati dalla polizia secondo le definizioni giuridiche nazionali: non misurano quanto il crimine sia diffuso. I magistrati professionali sono contati secondo le definizioni nazionali. Regno Unito e Bosnia ed Erzegovina non hanno valori per il 2019. Kosovo: questa designazione non pregiudica le posizioni sullo status ed è conforme alla risoluzione 1244/1999 del Consiglio di Sicurezza dell’ONU e al parere della Corte internazionale di giustizia sulla dichiarazione di indipendenza del Kosovo.</p>
    daycare_fines:
      summary: "fonte"
      body: |
        <p><b>Fonte.</b> Gneezy, U. e Rustichini, A. (2000). “A Fine Is a Price.” <i>Journal of Legal Studies</i> 29(1): 1–17, tabella 1 (“Number of late-coming parents per week according to day-care centers”), p. 6.</p>
        <p><b>Modifiche.</b> I 200 conteggi (10 asili × 20 settimane) e il numero di bambini per asilo sono stati trascritti dal docente dalla tabella 1 e organizzati con una riga per asilo e settimana. Le variabili fine_group e period sono state aggiunte in base al disegno dello studio (sezione II.B): la multa è stata introdotta all’inizio della settimana 5 negli asili 1–6 e tolta all’inizio della settimana 17. Trascrizione controllata con le medie per periodo della tabella 2.</p>
        <p><b>Note.</b> Secondo gli autori, lo studio è durato 21 settimane, con una settimana di vacanza dopo la 14; la settimana 11 aveva solo quattro giorni e gli autori ne hanno moltiplicato i conteggi per 5/4. Altri due asili sono stati esclusi dagli autori perché le rilevazioni erano incomplete. Uso didattico; citare l’articolo originale.</p>
    constitutions:
      summary: "fonte e licenza (costituzioni)"
      body: |
        <p><b>Fonte.</b> <a href="https://www.constituteproject.org">Constitute Project</a>: Elkins, Zachary, Tom Ginsburg e James Melton, <i>Constitute: The World’s Constitutions to Read, Search, and Compare</i>. Versioni inglesi di 25 costituzioni europee, scaricate a ottobre 2026. Ogni PDF dichiara di essere stato “generated from excerpts of texts from the repository of the Comparative Constitutions Project, and distributed on constituteproject.org”.</p>
        <p><b>Licenza.</b> <a href="https://creativecommons.org/licenses/by-nc/3.0/deed.it">Creative Commons Attribuzione-Non commerciale 3.0 (CC BY-NC 3.0)</a>: riutilizzo e adattamento solo per scopi non commerciali, citando Constitute Project. I file di testo e constitutions_text.dta sono un adattamento di questi testi e sono distribuiti con la stessa licenza. Nessun avallo da parte di Constitute Project o del Comparative Constitutions Project.</p>
        <p><b>Modifiche.</b> I PDF sono invariati. I file di testo sono stati estratti dal docente con pdftotext (pdf_to_txt.py): tolti copertina, indice, indice tematico, intestazioni e piè di pagina, etichette tematiche a margine e titoli in corpo più grande; riunite le parole spezzate a fine riga; testo diviso in frasi o commi numerati, uno per riga (18.853 righe); constitutions_list.csv ha una riga per costituzione. constitutions_text.dta contiene lo stesso testo come dataset Stata, una riga per frase. Nessuna parola è stata tradotta, corretta o modificata; l’estrazione automatica lascia alcuni errori.</p>
        <p><b>Ambito.</b> Quasi tutte le versioni inglesi sono traduzioni, non i testi giuridicamente vincolanti, e alcune potrebbero non includere gli ultimi emendamenti. Italia: è usata la versione con emendamenti fino al 2012, perché il PDF della versione 2020 su Constitute Project conteneva solo l’indice e l’indice tematico. Svizzera: testo fornito dalla Cancelleria federale svizzera; l’inglese non è una lingua ufficiale della Confederazione e la traduzione non ha valore legale. Le modifiche sono del docente; Constitute Project non ne è responsabile.</p>

