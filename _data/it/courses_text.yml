  lecture: "Lecture"
  sections:
    lecture-notes: "dispense"
    do-files: "do-file"
    dataset: "dataset"
  notes:
    do-files: "I file vanno tenuti in un'unica cartella del corso, con la stessa struttura di questa pagina: i do-file in <code>do/</code> (la simulazione in <code>do/provided/</code>) e il dataset in <code>data/</code>. Ogni do-file va eseguito con quella cartella come directory di lavoro di Stata."
    dataset: 'Fonte: Banca Mondiale, <i>Doing Business 2020</i>, indicatori “Enforcing contracts” (dati al 1° maggio 2019), con licenza <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>. Serie selezionate, ristrutturate e rietichettate; valori invariati. Doing Business è stato sospeso nel 2021: sono dati storici, a uso didattico.'
  details:
    dataset:
      summary: "dettagli su fonte e licenza"
      body: |
        <p><b>Fonte.</b> Gruppo Banca Mondiale, <i>Doing Business</i>, indicatori “Enforcing contracts”. Edizione: <i>Doing Business 2020</i> (dati al 1° maggio 2019); nei file della Banca Mondiale quest’anno è indicato come “2019”. <a href="https://datacatalog.worldbank.org/search/dataset/0038564/doing-business">Catalogo</a>; scaricato il 6 ottobre 2026 (DB_CSV.zip).</p>
        <p><b>Licenza.</b> <a href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Attribuzione 4.0 (CC BY 4.0)</a>. È richiesta l’attribuzione. La Banca Mondiale non avalla in alcun modo questo uso dei dati.</p>
        <p><b>Modifiche.</b> Selezionate 8 serie sull’esecuzione dei contratti e 191 economie (quelle con una regione nei metadati della fonte; esclusi gli aggregati regionali; incluso il Liechtenstein, pur fuori dalla classifica delle 190 economie); una riga per economia; variabili rinominate ed etichettate; aggiunte regione e fascia di reddito dai metadati. Nessuna imputazione; valori invariati.</p>
        <p><b>Ambito.</b> Gli indicatori descrivono una controversia commerciale ipotetica e standardizzata nella principale città d’affari (media di due città per 11 economie), sulla base di questionari a esperti: non sono medie di casi osservati. Doing Business è stato sospeso nel settembre 2021, dopo che erano emerse irregolarità nei dati delle edizioni 2018 e 2020. Vanno usati come dati storici, a fini didattici. Le etichette di regione e fascia di reddito vengono dai metadati della fonte.</p>
