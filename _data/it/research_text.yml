entries:
  ai-labor-demand:
    abstract: >-
      Studiamo come il rilascio di ChatGPT abbia influenzato la domanda di lavoro espressa negli annunci negli Stati
      Uniti, distinguendo il numero di posizioni che le imprese pubblicizzano dalla loro composizione per seniority.
      Utilizzando 314 milioni di annunci di lavoro (2016–2025) e una misura di esposizione ai LLM ancorata al loro
      utilizzo effettivo, confrontiamo occupazioni dello stesso settore, mercato metropolitano e mese in quattro
      regimi: pre-pandemia, shock pandemico, ripresa post-pandemica e post-rilascio. Dopo il rilascio, la domanda
      espressa negli annunci nelle occupazioni più esposte cala di 6,8 punti logaritmici rispetto alla ripresa
      post-pandemica di marzo 2021–ottobre 2022; la contrazione si amplia fino al 2025, resiste ai controlli per il
      lavoro da remoto ed è legata all’utilizzo misurato dei LLM più che alle capacità <i>ex ante</i>. La
      composizione per seniority si era mossa prima del rilascio: la quota junior degli annunci classificati nelle
      occupazioni esposte è scesa di 3,5 punti percentuali tra l’inizio del 2021 e il trimestre precedente ChatGPT,
      in parallelo con l’esposizione al lavoro da remoto, che spiega circa 1,5 punti del calo. Dopo il rilascio la
      quota è inferiore di 0,4 punti rispetto all’ultimo trimestre precedente, una differenza non distinguibile da
      zero. I risultati confermano il calo degli annunci junior nelle occupazioni esposte, ma lo collocano nei due
      anni precedenti il rilascio; finora l’effetto misurabile dell’IA generativa riguarda il numero di posizioni
      aperte.
    keywords: "IA generativa; ChatGPT; domanda di lavoro; seniority; annunci di lavoro; differenze nelle differenze."
  labels-outcomes:
    abstract: >-
      Gli annunci per profili junior sembrano diminuire nelle occupazioni esposte all’IA, ma la seniority si ricava
      da un testo che le imprese possono riformulare senza cambiare il lavoro. Una stima a differenze nelle
      differenze su un conteggio di annunci junior mescola una variazione dei posti offerti con una componente di
      etichettatura, dovuta alla formulazione e agli errori del classificatore. La quota di annunci che un
      classificatore etichetta, il suo tasso di etichettatura, rivela solo la componente comune a tutti i livelli;
      la parte specifica di ciascun livello richiede etichette umane su un campione stratificato per gruppo di
      esposizione, periodo e livello assegnato, compresi gli annunci senza etichetta. Proponiamo uno stimatore e una
      regola di allocazione delle etichette. Su 314 milioni di annunci statunitensi, a composizione per livello
      invariata, il calo annuo più ampio del tasso di etichettatura di un classificatore basato su regole dopo
      ChatGPT colloca questa componente a circa −0,7 punti logaritmici nel panel dell’applicazione empirica (−1,5 in
      un panel più aggregato, dove la lettura basata sugli anni di esperienza richiesti dà +5 dalla pandemia in poi). Con 252
      etichette umane, la variazione corretta della quota junior non ha un segno stabile tra le diverse letture con
      LLM; le simulazioni indicano che servono migliaia di etichette.
    keywords: "annunci di lavoro; misure derivate dal testo; seniority; posizioni di ingresso; IA generativa; modelli linguistici di grandi dimensioni; identificazione parziale."
  tipping-point:
    abstract: >-
      Le opportunità di corruzione attraggono chi le sfrutterebbe e allontanano chi prevede il costo di resistervi.
      Studio entrambi i margini in un modello di scelta occupazionale con costi di autocontrollo. Emergono tre
      risultati. Primo, in assenza di sanzioni, piccole rendite da corruzione riducono il bacino di chi entra nel
      settore pubblico quando meno della metà del valore del servizio onesto viene percepita al momento della
      decisione e il conflitto di autocontrollo è abbastanza forte rispetto a questa quota. Secondo, il settore
      pubblico può perdere integrità media mentre si restringe, per cui un organico stabile o in calo può nascondere
      un personale che peggiora. Terzo, a parità di surplus netto da corruzione, eliminare le opportunità di
      corruzione produce una quota di corrotti debolmente inferiore rispetto alle sanzioni differite, sia a salario
      dato sia con un numero fisso di posti, anche se non necessariamente un’integrità media più alta. Quando le
      rendite crescono con la quota di corrotti tra chi è in servizio, l’ordinamento si estende agli stati
      stazionari, e la prevenzione può eliminare uno stato stazionario ad alta corruzione che una sanzione
      equivalente lascia in piedi.
    keywords: "selezione occupazionale; autocontrollo e tentazione; corruzione; deterrenza; mercato del lavoro nel settore pubblico; equilibri multipli."
  crime-voting:
    abstract: >-
      Questo lavoro analizza se l’esposizione a notizie di cronaca geolocalizzate modifichi il comportamento di voto
      individuale nelle elezioni italiane. Utilizzando un panel di elettori bolognesi che non cambiano residenza,
      osservati in più tornate elettorali, sfruttiamo la variazione intra-individuale nell’esposizione a notizie di
      cronaca vicine alla residenza nel mese precedente il voto, controllando per effetti fissi individuali e di
      elezione. L’esposizione aggregata alle notizie di cronaca produce associazioni deboli e imprecise. La
      disaggregazione per nazionalità percepita dell’autore del reato rivela invece una netta asimmetria. Nelle
      elezioni nazionali, l’esposizione a notizie di reati attribuiti a immigrati vicino alla residenza
      dell’elettore è associata a un calo intra-individuale di circa 2 punti percentuali nel sostegno al Movimento
      Cinque Stelle, il principale partito senza una posizione chiara sull’immigrazione nel periodo considerato, e a
      un aumento comparabile dell’astensione; le notizie di reati attribuiti a cittadini italiani non mostrano
      un’associazione analoga. La risposta è specifica al contenuto criminale: notizie locali comparabili non legate
      alla cronaca non producono spostamenti analoghi. Queste risposte asimmetriche, assenti nelle misure aggregate,
      sono più coerenti con un segnale di nazionalità nella cronaca che attiva un frame immigrazione-sicurezza che
      con una reazione uniforme alla salienza del crimine. L’evidenza indica che a contare per il comportamento
      elettorale è l’attribuzione del reato nelle notizie locali, più che il suo semplice verificarsi. Un test di
      falsificazione sui tempi conferma la lettura legata alla campagna elettorale, ma è sensibile al classificatore
      della nazionalità dell’autore; interpretiamo quindi le stime come associazioni, con una replicazione su fonti
      diverse in corso per chiarire l’interpretazione causale.
    keywords: "criminalità; immigrazione; elezioni; mezzi di informazione; comportamento di voto individuale."
  childbirth-turnout:
    abstract: >-
      La nascita di un figlio è uno shock temporaneo che colpisce due elettori della stessa famiglia. Mi chiedo come
      la variazione della partecipazione elettorale che ne deriva si distribuisca all’interno della coppia. Uso i
      dati amministrativi sulla partecipazione al voto in quattro elezioni a Bologna (2004–2013), dove si vota di
      persona in giorni prestabiliti e l’unica alternativa è il voto in ospedale per chi vi è ricoverato, collegati
      ai registri che associano entrambi i genitori alla stessa nascita. Confronto le coppie il cui figlio nasce
      poco prima del voto con quelle il cui figlio nasce poco dopo. La perdita di voti si concentra nelle nascite
      dell’ultima settimana prima del voto. Rispetto alle coppie il cui figlio nasce nelle quattro settimane
      successive al voto, queste coppie esprimono 33,9 voti in meno ogni 100 coppie (su un massimo di 200), e la
      probabilità che votino entrambi i genitori è inferiore di 23,6 punti; il voto del solo padre e l’astensione di
      entrambi sono ciascuno più probabili di circa dieci punti, mentre il voto della sola madre cambia poco. Per le
      nascite da una a quattro settimane prima del voto, le differenze sono piccole. Un secondo disegno,
      descrittivo, segue le coppie attorno alla nascita del primo figlio: nel primo mese dopo la nascita la loro
      partecipazione è inferiore al livello precedente, e dal terzo mese in poi il divario tra la partecipazione
      della madre e quella del padre torna vicino al valore precedente la nascita. Le misure che facilitano il voto
      attorno alla nascita vanno quindi valutate in base al loro effetto sulla partecipazione di entrambi i
      genitori.
    keywords: "partecipazione elettorale; costi del voto; nascita; coppie; famiglia; genere; partecipazione politica."
  childcare-turnout:
    abstract: >-
      Vivere vicino a un bene pubblico fornito a livello locale aumenta la partecipazione al voto delle famiglie che
      ne beneficiano? Studiamo i servizi pubblici per l’infanzia a Bologna, con dati amministrativi sulla
      partecipazione al voto in quattro elezioni (2004–2013), collegati ai registri anagrafici e a un censimento
      geocodificato delle strutture. Seguiamo i genitori con un solo figlio dal nido alla scuola dell’infanzia e poi
      alla scuola primaria statale, così che la struttura rilevante, e la sua distanza da casa, cambia con l’età del
      figlio. Se la vicinanza induce i genitori a chiedere conto al Comune, la partecipazione dovrebbe diminuire con
      la distanza dai servizi comunali (nido e scuola dell’infanzia) solo nelle elezioni locali, e non con la
      distanza dalla scuola primaria statale. Confrontando ciascun genitore con sé stesso, non rileviamo alcun
      gradiente di questo tipo. I test di equivalenza escludono effetti superiori a 0,56 punti percentuali ogni 100
      metri (1,5 punti sull’intervallo interquartile della distanza). Escludono quindi effetti grandi quanto il calo
      di 2,6 punti, già documentato, nella partecipazione delle madri da uno a due anni dopo la nascita del primo
      figlio, ma non effetti di un punto. Nei limiti di precisione dei dati, la vicinanza lascia invariato anche il
      calo di partecipazione legato alla genitorialità. Quando i genitori vengono confrontati anche all’interno
      della stessa sezione elettorale e della stessa elezione, la partecipazione alle elezioni locali diminuisce con
      la distanza dalla scuola statale e, tra i genitori che non hanno cambiato indirizzo, con la distanza dai
      servizi comunali. Entrambi i cali sono significativi solo nel 2009, ma non si distinguono da quelli del 2004.
      Poiché il gradiente compare anche per la scuola statale e i due livelli di governo non si possono distinguere,
      il disegno non consente di attribuirlo all’accountability. Le stime delimitano l’effetto di vivere vicino a
      una struttura, non quello di ottenervi un posto.
    keywords: "partecipazione elettorale; beni pubblici; servizi per l’infanzia; genere; elezioni locali."
