entries:
  ai-labor-demand:
    abstract: >-
      Studiamo come il rilascio di ChatGPT abbia influenzato la domanda di lavoro espressa negli annunci negli Stati
      Uniti, distinguendo il numero di posizioni che le imprese pubblicizzano dalla loro composizione per seniority.
      Utilizzando 314 milioni di annunci di lavoro (2016–2025) e una misura di esposizione ai LLM ancorata al loro
      utilizzo effettivo, confrontiamo occupazioni dello stesso settore, mercato metropolitano e mese in quattro
      regimi: pre-pandemia, shock pandemico, ripresa post-pandemica e post-rilascio. Dalla ripresa di marzo
      2021–ottobre 2022 al periodo successivo al rilascio, il divario negli annunci tra le occupazioni del quartile
      più esposto e le altre si allarga di 6,8 punti logaritmici. La contrazione cresce fino al 2025, resiste ai
      controlli per il lavoro da remoto ed è prevista dall’utilizzo osservato dei LLM, al di là delle misure ex ante
      di ciò che i LLM sono in grado di fare. La composizione per seniority si era mossa prima del rilascio: tra gli
      annunci che il nostro classificatore assegna a un livello di seniority, la quota junior nelle occupazioni
      esposte è scesa di circa 3,5 punti percentuali rispetto alle altre tra l’inizio del 2021 e il trimestre
      precedente ChatGPT, e circa 1,5 di questi punti si devono all’esposizione al lavoro da remoto. Dopo il
      rilascio la quota è inferiore di 0,4 punti rispetto all’ultimo trimestre precedente, una differenza non
      distinguibile da zero. La quota junior è effettivamente diminuita nelle occupazioni esposte rispetto alle
      altre, ma nei due anni precedenti il rilascio; finora l’effetto misurabile dell’IA generativa riguarda il
      numero di posizioni aperte.
    keywords: "IA generativa; ChatGPT; domanda di lavoro; seniority; annunci di lavoro; differenze nelle differenze."
  labels-outcomes:
    abstract: >-
      Un’etichetta ricavata dal testo di un annuncio di lavoro è un esito: le imprese possono cambiare la
      formulazione senza cambiare la posizione. La seniority è un’etichetta di questo tipo, per cui una stima a
      differenze nelle differenze su un conteggio di annunci etichettati come junior mescola una componente di
      domanda espressa negli annunci con una componente di etichettatura, dovuta alla formulazione delle imprese e
      agli errori del classificatore. Il tasso di etichettatura, cioè la quota di annunci che un classificatore
      etichetta, identifica al più la parte comune a tutti i livelli; il resto richiede etichette di riferimento su
      un campione stratificato per gruppo di trattamento, periodo e livello assegnato, compresi gli annunci senza
      etichetta. Proponiamo uno stimatore e una regola di allocazione, che colloca la maggior parte delle etichette
      di riferimento negli strati senza etichetta. Su 314 milioni di annunci statunitensi, dopo il rilascio di
      ChatGPT il tasso di etichettatura di un classificatore basato su regole si sposta di meno di un punto
      logaritmico nel panel dell’applicazione empirica, in modo non distinguibile da zero; la lettura basata sugli
      anni di esperienza richiesti, alla base dei campi strutturati dei fornitori di dati, aumenta di circa 5 punti
      logaritmici dalla pandemia in poi. Con 252 etichette umane, il segno della variazione corretta della quota
      junior dipende da quale lettura del modello viene corretta. Nelle simulazioni, i soli errori fissi del
      classificatore producono una componente specifica per livello di circa 15 punti logaritmici, e campioni di
      validazione di dimensione usuale raramente rilevano una rietichettatura.
    keywords: "annunci di lavoro; misure derivate dal testo; seniority; posizioni di ingresso; IA generativa; modelli linguistici di grandi dimensioni; identificazione parziale."
  tipping-point:
    abstract: >-
      La possibilità di intascare una tangente attrae chi la intascherebbe e allontana chi dovrebbe continuare a
      rifiutarla. Studio entrambi gli effetti in un modello di scelta occupazionale in cui il costo di resistere
      risponde alla tangente, ricevuta subito, e non a una sanzione che arriva dopo. Primo, una piccola tangente
      riduce il numero di persone che vogliono un impiego pubblico quando la quota del valore dell’onestà percepita
      al momento della scelta è abbastanza bassa; al primo ordine la soglia dipende dai due parametri della
      tentazione, non dalla distribuzione dei tipi. Secondo, la dimensione non rivela la composizione: a quella
      soglia l’organico resta fermo mentre gli entranti onesti sono sostituiti da entranti corrotti, e appena sopra
      di essa il settore si restringe e insieme peggiora. Terzo, tra riforme che riducono della stessa misura il
      guadagno netto dalla corruzione, eliminare l’opportunità lascia una quota di corrotti non superiore a quella
      di una sanzione differita, a salario dato e con un numero fisso di posti; con posti fissi, lasciare che le
      persone scelgano se entrare attenua questo vantaggio e non lo amplifica mai. Con tangenti che crescono con la
      quota di corrotti tra chi è in servizio, l’ordinamento si estende agli stati stazionari, e la prevenzione può
      eliminare uno stato stazionario ad alta corruzione che una sanzione equivalente lascia in piedi.
    keywords: "selezione occupazionale; autocontrollo e tentazione; corruzione; deterrenza; mercato del lavoro nel settore pubblico; equilibri multipli."
  crime-voting:
    abstract: >-
      Questo lavoro analizza se l’esposizione a notizie di cronaca geolocalizzate modifichi il comportamento di voto
      individuale nelle elezioni italiane. Utilizzando un panel di elettori bolognesi che non cambiano residenza,
      osservati in più tornate elettorali, sfruttiamo la variazione intra-individuale nell’esposizione a notizie di
      cronaca vicine alla residenza nel mese precedente il voto, controllando per effetti fissi individuali e di
      elezione. L’esposizione aggregata alle notizie di cronaca produce associazioni deboli e imprecise. La
      disaggregazione per nazionalità percepita dell’autore del reato rivela invece una netta asimmetria. Nelle
      elezioni nazionali, l’esposizione a notizie di reati attribuiti a immigrati vicino alla residenza
      dell’elettore è associata a un calo intra-individuale di circa 2 punti percentuali nel sostegno al Movimento
      Cinque Stelle, il principale partito senza una posizione chiara sull’immigrazione nel periodo considerato, e a
      un aumento comparabile dell’astensione; le notizie di reati attribuiti a cittadini italiani non mostrano
      un’associazione analoga. La risposta è specifica al contenuto criminale: notizie locali comparabili non legate
      alla cronaca non producono spostamenti analoghi. Queste risposte asimmetriche, assenti nelle misure aggregate,
      sono più coerenti con un segnale di nazionalità nella cronaca che attiva un frame immigrazione-sicurezza che
      con una reazione uniforme alla salienza del crimine. L’evidenza indica che a contare per il comportamento
      elettorale è l’attribuzione del reato nelle notizie locali, più che il suo semplice verificarsi. Un test di
      falsificazione sui tempi conferma la lettura legata alla campagna elettorale, ma è sensibile al classificatore
      della nazionalità dell’autore; interpretiamo quindi le stime come associazioni, con una replicazione su fonti
      diverse in corso per chiarire l’interpretazione causale.
    keywords: "criminalità; immigrazione; elezioni; mezzi di informazione; comportamento di voto individuale."
  childbirth-turnout:
    abstract: >-
      La nascita di un figlio è uno shock temporaneo che colpisce due elettori della stessa famiglia. Mi chiedo come
      la variazione della partecipazione elettorale che ne deriva si distribuisca all’interno della coppia. Uso i
      dati amministrativi sulla partecipazione al voto in quattro elezioni a Bologna (2004–2013), collegati ai
      registri anagrafici che associano entrambi i genitori alla stessa nascita. Si vota di persona in giorni
      prestabiliti, e l’unica alternativa è il voto in ospedale per chi vi è ricoverato. Confronto le coppie il cui
      figlio nasce poco prima del voto con quelle il cui figlio nasce poco dopo. La perdita di voti viene dalle
      nascite dell’ultima settimana prima del voto. Rispetto alle coppie il cui figlio nasce nelle quattro settimane
      successive al voto, queste coppie esprimono 33,9 voti in meno ogni 100 coppie (su un massimo di 200), e la
      probabilità che votino entrambi i genitori è inferiore di 23,6 punti; il voto del solo padre e l’astensione di
      entrambi sono ciascuno più probabili di circa dieci punti, mentre il voto della sola madre cambia poco. Gran
      parte dell’astensione aggiuntiva dei padri si verifica nelle coppie in cui si astiene anche la madre, ma i
      dati non permettono di stabilire se la nascita modifichi la dipendenza tra le decisioni dei due partner. Per
      le nascite avvenute da otto a 28 giorni prima del voto, le differenze sono molto più piccole. Un secondo
      disegno, descrittivo, segue le coppie attorno alla nascita del primo figlio: nel primo mese dopo la nascita la
      loro partecipazione è inferiore al livello precedente, e dal terzo mese in poi il divario tra la
      partecipazione della madre e quella del padre torna vicino al valore precedente la nascita. Le misure che
      facilitano il voto attorno alla nascita vanno quindi valutate in base al loro effetto sulla partecipazione di
      entrambi i genitori.
    keywords: "partecipazione elettorale; costi del voto; nascita; coppie; famiglia; genere; partecipazione politica."
  childcare-turnout:
    abstract: >-
      Vivere vicino a un bene pubblico fornito a livello locale aumenta la partecipazione al voto delle famiglie che
      ne beneficiano? Studiamo i servizi pubblici per l’infanzia a Bologna, con dati amministrativi sulla
      partecipazione al voto in quattro elezioni (2004–2013), collegati ai registri anagrafici e a un censimento
      geocodificato delle strutture. Seguiamo i genitori con un solo figlio dal nido alla scuola dell’infanzia e poi
      alla scuola primaria statale, così che la struttura rilevante, e la sua distanza da casa, cambia con l’età del
      figlio. Se la vicinanza induce i genitori a chiedere conto al Comune, la partecipazione dovrebbe diminuire con
      la distanza dai servizi comunali (nido e scuola dell’infanzia) solo nelle elezioni locali, e non con la
      distanza dalla scuola primaria statale. Nella specificazione di base, che segue ciascun genitore nelle diverse
      elezioni, la partecipazione non diminuisce con la distanza. I test di equivalenza escludono effetti superiori
      a 0,56 punti percentuali ogni 100 metri, ovvero 1,5 punti sull’intervallo interquartile della distanza: su
      questo intervallo sono esclusi effetti grandi quanto il calo di 2,6 punti, già documentato, nella
      partecipazione delle madri da uno a due anni dopo la nascita del primo figlio. Effetti di un punto non lo
      sono. Nei limiti di precisione dei dati, la vicinanza lascia invariato anche il calo di partecipazione legato
      alla genitorialità. Quando i genitori vengono confrontati anche all’interno della stessa sezione elettorale e
      della stessa elezione, la partecipazione alle elezioni locali diminuisce con la distanza dalla scuola statale
      e, tra i genitori che non hanno cambiato indirizzo, con la distanza dai servizi comunali. Entrambi i cali sono
      significativi solo nel 2009, ma non si distinguono da quelli del 2004. Poiché il calo compare anche per la
      scuola statale e i livelli comunale e statale non si possono distinguere, il disegno non consente né di
      attribuirlo all’accountability né di escludere questa lettura. Le stime delimitano l’effetto di vivere vicino
      a una struttura, non quello di ottenervi un posto.
    keywords: "partecipazione elettorale; beni pubblici; servizi per l’infanzia; genere; elezioni locali."
